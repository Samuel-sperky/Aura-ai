<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title>Aura ekosystém — stav 7. 8. 2026</title>

  <style>
    .slide { display: none }
    .slide.on { display: block }

    .eb   { font-size: 12px; letter-spacing: .22em; fill: #05bcc4; font-family: ui-monospace, Consolas, monospace }
    .h1   { font-size: 42px; fill: #e8f0ef; font-family: Georgia, serif; font-weight: 500 }
    .h2   { font-size: 27px; fill: #e8f0ef; font-family: Georgia, serif; font-weight: 500 }
    .sub  { font-size: 16px; fill: #b9c9c7 }
    .txt  { font-size: 15px; fill: #e8f0ef }
    .dim  { font-size: 14px; fill: #829896 }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #b9c9c7 }
    .big  { font-size: 58px; fill: #05bcc4; font-family: Georgia, serif }
    .lbl  { font-size: 11px; letter-spacing: .14em; fill: #829896; font-family: ui-monospace, Consolas, monospace }

    .card { fill: #131b1a; stroke: #22302e }
    .rule { stroke: #22302e }

    .dot     { fill: #22302e; cursor: pointer }
    .dot.on  { fill: #05bcc4 }
    .hit     { fill: transparent; cursor: pointer }
  </style>

  <rect width="1280" height="720" fill="#0e1413"/>
  <rect width="1280" height="2" fill="#03797e"/>

  <!-- chrome -->
  <text x="1200" y="46" class="lbl" text-anchor="end">♛ AURA</text>
  <text x="1200" y="676" class="mono" id="ct" text-anchor="end">01 / 07</text>

  <!-- ============ 01 titul ============ -->
  <g class="slide on" id="s1">
    <text x="80" y="250" class="eb">STAV K 7. 8. 2026</text>
    <text x="80" y="330" class="h1">Aura ekosystém</text>
    <text x="80" y="382" class="h1" fill="#829896">Hades · AuraAI · AuraHub · appky</text>
    <line x1="80" y1="430" x2="360" y2="430" class="rule" stroke-width="1"/>
    <text x="80" y="470" class="sub">Tri vrstvy, jedenásť artefaktov, štyri stupne nasadenia.</text>
    <text x="80" y="496" class="dim">Zdroj: Hades MCP — 800 uzlov, 2 617 hrán.</text>
    <text x="80" y="580" class="lbl">← → PRE POSUN · KLIK POKRAČUJE</text>
  </g>

  <!-- ============ 02 tri vrstvy ============ -->
  <g class="slide" id="s2">
    <text x="80" y="96" class="eb">01 · ČO JE ČO</text>
    <text x="80" y="150" class="h1">Tri vrstvy</text>
    <text x="80" y="188" class="sub">Zamieňajú sa najčastejšie. Nie je to jedna appka.</text>

    <rect x="80" y="230" width="360" height="330" rx="6" class="card"/>
    <rect x="80" y="230" width="360" height="3" fill="#05bcc4"/>
    <text x="112" y="286" class="h2">Myseľ</text>
    <text x="112" y="322" class="txt">Hades — jadro vedomia</text>
    <text x="112" y="350" class="txt">AuraAI — rozhranie nad ním</text>
    <text x="112" y="396" class="dim">Pamäť, uzly, hrany, MCP.</text>
    <text x="112" y="420" class="dim">Vie, čo sa v rodine stalo.</text>
    <text x="112" y="490" class="lbl">ROZVÍJA SA</text>

    <rect x="460" y="230" width="360" height="330" rx="6" class="card"/>
    <rect x="460" y="230" width="360" height="3" fill="#d8b878"/>
    <text x="492" y="286" class="h2">Rozcestník</text>
    <text x="492" y="322" class="txt">AuraHub — port 3050</text>
    <text x="492" y="368" class="dim">Jedna obrazovka nad všetkým.</text>
    <text x="492" y="392" class="dim">Bez databázy — čísla</text>
    <text x="492" y="416" class="dim">patria appkám.</text>
    <text x="492" y="490" class="lbl" fill="#e8a33d">2 ZO 6 KARIET MÁ DÁTA</text>

    <rect x="840" y="230" width="360" height="330" rx="6" class="card"/>
    <rect x="840" y="230" width="360" height="3" fill="#3fbf7f"/>
    <text x="872" y="286" class="h2">Appky</text>
    <text x="872" y="322" class="txt">9 nástrojov, 2 vetvy</text>
    <text x="872" y="368" class="dim">Každá vlastná DB a login.</text>
    <text x="872" y="392" class="dim">Vetva A: Express + vanilla.</text>
    <text x="872" y="416" class="dim">Vetva B: Next 16 + React 19.</text>
    <text x="872" y="490" class="lbl" fill="#3fbf7f">NOVÉ STAVAJ NA VETVE B</text>
  </g>

  <!-- ============ 03 porty ============ -->
  <g class="slide" id="s3">
    <text x="80" y="96" class="eb">02 · KDE TO BEŽÍ</text>
    <text x="80" y="150" class="h1">Mapa portov</text>
    <text x="80" y="188" class="sub">Kolízia portu je najčastejšia chyba pri nasadení.</text>

    <g class="mono" font-size="15">
      <circle cx="90" cy="228" r="4" fill="#3fbf7f"/><text x="120" y="233" fill="#e8f0ef">3000</text><text x="220" y="233">sperky-ai — Marketing</text>
      <circle cx="90" cy="266" r="4" fill="#829896"/><text x="120" y="271" fill="#e8f0ef">3010</text><text x="220" y="271">Northstar V3 — archív, nedotknutý</text>
      <circle cx="90" cy="304" r="4" fill="#3fbf7f"/><text x="120" y="309" fill="#e8f0ef">3011</text><text x="220" y="309">ads-hierarchy</text>
      <circle cx="90" cy="342" r="4" fill="#3fbf7f"/><text x="120" y="347" fill="#e8f0ef">3020</text><text x="220" y="347">Aura Logistika</text>
      <circle cx="90" cy="380" r="4" fill="#3fbf7f"/><text x="120" y="385" fill="#e8f0ef">3030</text><text x="220" y="385">Aura KPI</text>
      <circle cx="90" cy="418" r="4" fill="#3fbf7f"/><text x="120" y="423" fill="#e8f0ef">3040</text><text x="220" y="423">Aura Roadmap</text>
      <circle cx="90" cy="456" r="4" fill="#e8a33d"/><text x="120" y="461" fill="#e8f0ef">3050</text><text x="220" y="461">AuraHub — loopback only</text>
      <circle cx="90" cy="494" r="4" fill="#e8a33d"/><text x="120" y="499" fill="#e8f0ef">3070</text><text x="220" y="499">Aura Zľavy — chýba seed admina</text>
      <circle cx="90" cy="532" r="4" fill="#3fbf7f"/><text x="120" y="537" fill="#e8f0ef">8082</text><text x="220" y="537">AuraAI</text>
      <circle cx="90" cy="570" r="4" fill="#3fbf7f"/><text x="120" y="575" fill="#e8f0ef">8091</text><text x="220" y="575">Aura Banner Studio</text>
      <circle cx="90" cy="608" r="4" fill="#3fbf7f"/><text x="120" y="613" fill="#e8f0ef">8095</text><text x="220" y="613">Caddy pred AuraAI</text>
    </g>

    <text x="780" y="233" class="dim">Kontrakt Zliav hovoril 3050.</text>
    <text x="780" y="259" class="dim">Ten bol obsadený hubom,</text>
    <text x="780" y="285" class="dim">takže appka beží na 3070 —</text>
    <text x="780" y="311" class="dim">kontrakt v tomto bode neplatí.</text>
  </g>

  <!-- ============ 04 stupne ============ -->
  <g class="slide" id="s4">
    <text x="80" y="96" class="eb">03 · POROVNANIE</text>
    <text x="80" y="150" class="h1">Nasadené vs nenasadené</text>
    <text x="80" y="188" class="sub">Dva stupne nestačia — tri appky bežia a pritom nefungujú.</text>

    <g>
      <text x="80" y="268" class="txt" font-size="17">A · nasadené a funkčné</text>
      <rect x="480" y="250" width="540" height="24" rx="3" fill="#3fbf7f"/>
      <text x="1040" y="269" class="txt" font-size="17" fill="#3fbf7f">6</text>

      <text x="80" y="348" class="txt" font-size="17">B · nasadené, nedokončené</text>
      <rect x="480" y="330" width="270" height="24" rx="3" fill="#e8a33d"/>
      <text x="770" y="349" class="txt" font-size="17" fill="#e8a33d">3</text>

      <text x="80" y="428" class="txt" font-size="17">C · postavené, nenasadené</text>
      <rect x="480" y="410" width="360" height="24" rx="3" fill="#05bcc4"/>
      <text x="860" y="429" class="txt" font-size="17" fill="#05bcc4">4</text>

      <text x="80" y="508" class="txt" font-size="17">D · nenasadené vôbec</text>
      <rect x="480" y="490" width="540" height="24" rx="3" fill="#e0554e"/>
      <text x="1040" y="509" class="txt" font-size="17" fill="#e0554e">6</text>
    </g>

    <line x1="80" y1="570" x2="1200" y2="570" class="rule" stroke-width="1"/>
    <text x="80" y="608" class="dim">Meria sa na piatich dimenziách: Docker · git remote · testy · verejná dostupnosť · zapojenie do hubu.</text>
  </g>

  <!-- ============ 05 stupeň B ============ -->
  <g class="slide" id="s5">
    <text x="80" y="96" class="eb">04 · NAJZRADNEJŠIE</text>
    <text x="80" y="150" class="h1">Beží, a nefunguje</text>
    <text x="80" y="188" class="sub">Všetky tri by prešli akýmkoľvek healthcheckom.</text>

    <rect x="80" y="222" width="1120" height="108" rx="6" class="card"/>
    <rect x="80" y="222" width="3" height="108" fill="#e8a33d"/>
    <text x="112" y="262" class="h2" font-size="21">AuraHub · 3050</text>
    <text x="112" y="296" class="txt">4 zo 6 kariet nemá dáta — chýba /api/summary v Roadmape, sperky-ai a HR.</text>
    <text x="112" y="318" class="dim">Hub hlási dôvod namiesto čísla, takže to nevyzerá ako porucha.</text>

    <rect x="80" y="352" width="1120" height="108" rx="6" class="card"/>
    <rect x="80" y="352" width="3" height="108" fill="#e0554e"/>
    <text x="112" y="392" class="h2" font-size="21">Aura Zľavy · 3070</text>
    <text x="112" y="426" class="txt">Nasadené a nepoužiteľné — bez admin účtu sa nedá prihlásiť, zápisy sú vypnuté.</text>
    <text x="112" y="448" class="dim">Už raz sa to stalo naostro: users=0 → všetko 401 → UI plné chýb, appka zdravá.</text>

    <rect x="80" y="482" width="1120" height="108" rx="6" class="card"/>
    <rect x="80" y="482" width="3" height="108" fill="#e8a33d"/>
    <text x="112" y="522" class="h2" font-size="21">AuraAI · 8082</text>
    <text x="112" y="556" class="txt">Mapa mysle sa dá prezerať, ale nedá sa v nej hľadať — W4 nie je hotové.</text>
    <text x="112" y="578" class="dim">Pri 800 uzloch je to citeľné.</text>

    <text x="80" y="640" class="lbl" fill="#e8a33d">„BEŽÍ" MUSÍ ZNAMENAŤ „PRIHLÁSIM SA A SPRAVÍM JEDNU REÁLNU OPERÁCIU"</text>
  </g>

  <!-- ============ 06 dve zistenia ============ -->
  <g class="slide" id="s6">
    <text x="80" y="96" class="eb">05 · ČO VYŠLO AŽ Z POROVNANIA</text>
    <text x="80" y="150" class="h1">Dve zistenia</text>

    <rect x="80" y="212" width="540" height="330" rx="6" class="card"/>
    <text x="112" y="298" class="big">1 z 11</text>
    <text x="112" y="344" class="txt" font-size="18">appiek je verejne dostupná</text>
    <line x1="112" y1="378" x2="300" y2="378" class="rule" stroke-width="1"/>
    <text x="112" y="416" class="dim">AuraAI, a to za basic-auth.</text>
    <text x="112" y="442" class="dim">Celá ostatná rodina je loopback.</text>
    <text x="112" y="468" class="dim">Hub sa nesmie tunelovať, kým</text>
    <text x="112" y="494" class="dim">nemá vlastný login.</text>

    <rect x="660" y="212" width="540" height="330" rx="6" class="card"/>
    <text x="692" y="298" class="big" fill="#e0554e">6</text>
    <text x="692" y="344" class="txt" font-size="18">artefaktov beží bez git remote</text>
    <line x1="692" y1="378" x2="880" y2="378" class="rule" stroke-width="1"/>
    <text x="692" y="416" class="dim">Kód existuje v jedinej kópii</text>
    <text x="692" y="442" class="dim">na jednom PC. AuraAI má commit</text>
    <text x="692" y="468" class="dim">s tunelom nepushnutý, Roadmap</text>
    <text x="692" y="494" class="dim">má push ako jediné nesplnené</text>
    <text x="692" y="520" class="dim">akceptačné kritérium.</text>

    <text x="80" y="600" class="txt">Dôvod je v oboch prípadoch zhodný a banálny: <tspan class="mono" font-size="15" fill="#e8f0ef">gh</tspan> nebolo v prostredí nainštalované.</text>
    <text x="80" y="628" class="dim">Najlacnejšia otvorená položka v celom zozname — a tá s najhoršou stratou pri poruche disku.</text>
  </g>

  <!-- ============ 07 čo ďalej ============ -->
  <g class="slide" id="s7">
    <text x="80" y="96" class="eb">06 · ĎALŠIE KROKY</text>
    <text x="80" y="150" class="h1">Päť vecí v poradí</text>
    <text x="80" y="188" class="sub">Zoradené podľa toho, čo blokuje najviac ďalších vecí.</text>

    <g>
      <text x="80" y="262" class="h2" font-size="24" fill="#05bcc4">1</text>
      <text x="140" y="262" class="txt" font-size="17">Dokončiť /api/summary pre Roadmap a sperky-ai</text>
      <text x="140" y="288" class="dim">Kód je napísaný, ale necommitnutý na feat/suite-visuals — odblokuje 2 mŕtve karty hubu.</text>

      <text x="80" y="352" class="h2" font-size="24" fill="#05bcc4">2</text>
      <text x="140" y="352" class="txt" font-size="17">Pridať auth pred AuraHub</text>
      <text x="140" y="378" class="dim">Bez neho sa hub nesmie vystaviť — čísla všetkých appiek by boli verejné bez hesla.</text>

      <text x="80" y="442" class="h2" font-size="24" fill="#05bcc4">3</text>
      <text x="140" y="442" class="txt" font-size="17">Seed admina v Aura Zľavách</text>
      <text x="140" y="468" class="dim">Appka je hotová, ale bez účtu nepoužiteľná. Vyžaduje reálne TTY.</text>

      <text x="80" y="532" class="h2" font-size="24" fill="#05bcc4">4</text>
      <text x="140" y="532" class="txt" font-size="17">Nastaviť git remote a pushnúť šesť artefaktov</text>
      <text x="140" y="558" class="dim">Vrátane rotácie bcrypt hashu, ktorý je v git-trackovanom Caddyfile.</text>

      <text x="80" y="622" class="h2" font-size="24" fill="#05bcc4">5</text>
      <text x="140" y="622" class="txt" font-size="17">Read-only DB users kpi_ro a roadmap_ro</text>
      <text x="140" y="648" class="dim">Dovtedy sa integrácie medzi appkami robia ručne.</text>
    </g>
  </g>

  <!-- dots -->
  <g>
    <circle class="dot on" id="d1" cx="86" cy="672" r="5"/>
    <circle class="dot" id="d2" cx="112" cy="672" r="5"/>
    <circle class="dot" id="d3" cx="138" cy="672" r="5"/>
    <circle class="dot" id="d4" cx="164" cy="672" r="5"/>
    <circle class="dot" id="d5" cx="190" cy="672" r="5"/>
    <circle class="dot" id="d6" cx="216" cy="672" r="5"/>
    <circle class="dot" id="d7" cx="242" cy="672" r="5"/>
  </g>

  <script><![CDATA[
    (function () {
      var N = 7, i = 0;

      function go(n) {
        i = (n + N) % N;
        for (var k = 1; k <= N; k++) {
          document.getElementById('s' + k).setAttribute('class', 'slide' + (k === i + 1 ? ' on' : ''));
          document.getElementById('d' + k).setAttribute('class', 'dot' + (k === i + 1 ? ' on' : ''));
        }
        document.getElementById('ct').textContent = ('0' + (i + 1)).slice(-2) + ' / 0' + N;
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(i + 1); e.preventDefault(); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(i - 1); e.preventDefault(); }
        if (e.key === 'Home') go(0);
        if (e.key === 'End') go(N - 1);
      });

      document.addEventListener('click', function () { go(i + 1); });

      for (var k = 1; k <= N; k++) {
        (function (idx) {
          document.getElementById('d' + idx).addEventListener('click', function (e) {
            e.stopPropagation();
            go(idx - 1);
          });
        })(k);
      }
    })();
  ]]></script>
</svg>
