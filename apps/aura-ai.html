<!doctype html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aura AI · chat a zvyšné aplikácie</title>
<style>
/* ══════════════════════════════════════════════════════════════
   ZÁKLAD — prevzatý 1:1 z apps/aura-apps-hub.html (blok <style>).
   Needituj tu: uprav hub alebo build/aura-ai/extra.css a spusti
   node apps/build/aura-ai/assemble.mjs
   ══════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Geist+Mono:wght@400;500&display=swap');

:root{
  /* jadro značky */
  --teal:#05bcc4; --teal-2:#03797e; --teal-3:#7fd0d4;
  --gold:#d8b878; --gold-t:#c9a869;
  --paper:#0e1413; --card:#131b1a; --card-2:#1b2523; --line:#22302e;
  --ink:#e8f0ef; --ink-2:#b9c9c7; --ink-3:#829896;
  /* stavové (LEN pre stavy/badge, nie pre brand akcenty) */
  --good:#3fbf7f; --amber:#e8a33d; --red:#e0554e; --violet:#8b7fd4;
  /* brand akcenty modulov (oddelené od stavových) */
  --b-mkt:#05bcc4; --b-hr:#8b7fd4; --b-kpi:#d3a53a; --b-fin:#2fae7a; --b-log:#e07a3e; --b-road:#2a8f96;
  /* rodina appiek = Geist + Playfair (Inter je štandard reportov, JetBrains Mono decku) */
  --mono:'Geist Mono',ui-monospace,monospace;
  --disp:'Playfair Display',Georgia,serif;
  --body:'Geist',Inter,system-ui,sans-serif;
  --acc:var(--teal);
  --r:14px;
  --tnum:"tnum" 1,"lnum" 1;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --dur-1:150ms; --dur-2:250ms;
}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root[data-theme="light"]{
  --paper:#f4f0f3; --card:#ffffff; --card-2:#eae3e8; --line:#ded5dc;
  --ink:#131b1a; --ink-2:#37423f; --ink-3:#5a6968; --gold-t:#8a6417;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100vh;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.tnum{font-feature-settings:var(--tnum);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
button{font-family:inherit}

/* ── global control bar ─────────────────────────────────────── */
.gbar{
  position:fixed; top:0; left:0; right:0; min-height:52px; z-index:60;
  display:flex; align-items:center; gap:12px; padding:0 16px; flex-wrap:wrap;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.hamb{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;place-items:center}
.hamb svg{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:700;letter-spacing:.2px;background:none;border:0;padding:0;color:inherit}
.crown{width:20px;height:20px;color:var(--gold)}
.brand .w{font-family:var(--disp);font-size:18px}
.brand .w b{color:var(--teal)}
.demo-tag{
  font:600 9px/1 var(--mono); letter-spacing:.12em; color:color-mix(in srgb,var(--amber) 75%,var(--ink-3));
  border:1px solid color-mix(in srgb,var(--amber) 28%,var(--line));
  padding:4px 8px; border-radius:20px; text-transform:uppercase;
  background:none; white-space:nowrap; opacity:.85;
}
.crown.pulse{animation:crownp .45s var(--ease-out) 2}
@keyframes crownp{50%{transform:scale(1.18)}}
.goldline{border-bottom:1px solid color-mix(in srgb,var(--gold) 45%,transparent)!important}
.btn:active,.chip:active,.icon-btn:active{transform:translateY(1px) scale(.98)}
.gspace{flex:1}
.ctl{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{font:600 12px var(--body);color:var(--ink-3);background:transparent;border:0;padding:7px 11px;cursor:pointer}
.seg button.on{color:#03201f;background:var(--teal)}
:root[data-theme="light"] .seg button.on{color:#fff}
.icon-btn{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dotb{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--card)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;cursor:pointer;border:0;flex:none}

.view{padding-top:52px;min-height:100vh}

/* ── HUB landing ────────────────────────────────────────────── */
.hub{max-width:1120px;margin:0 auto;padding:56px 26px 80px}
.hub .eb{font:600 12px var(--mono);letter-spacing:.2em;color:var(--teal);text-transform:uppercase}
.hub h1{font-family:var(--disp);font-weight:800;font-size:clamp(32px,5vw,54px);line-height:1.05;margin:16px 0 10px;letter-spacing:-.5px}
.hub h1 em{color:var(--teal);font-style:normal}
.hub .lead{color:var(--ink-2);font-size:18px;max-width:620px;margin:0 0 12px}
.hub .note{color:var(--ink-3);font-size:13.5px;max-width:640px;margin:0 0 40px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid6{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid6{grid-template-columns:1fr}}
.mcard{position:relative;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px 20px;cursor:pointer;overflow:hidden;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;color:inherit;font-family:inherit}
.mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
.mcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 55%,var(--line));box-shadow:0 14px 34px -20px var(--ac)}
:root[data-theme="light"] .mcard{box-shadow:0 1px 2px rgba(20,20,30,.05)}
.mcard .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);margin-bottom:14px}
.mcard .ico svg{width:22px;height:22px}
.mcard .num{position:absolute;top:18px;right:18px;font:600 12px var(--mono);color:var(--ink-3)}
.mcard h3{font-family:var(--disp);font-weight:700;font-size:21px;margin:0 0 6px}
.mcard p{color:var(--ink-2);font-size:13.5px;margin:0 0 14px;min-height:40px}
.mcard .meta{display:flex;align-items:center;gap:8px;color:var(--ink-3);font:600 11.5px var(--mono);letter-spacing:.04em}
.mcard .go{margin-left:auto;color:var(--ac);display:inline-flex;align-items:center;gap:4px}
.mcard .go svg{transition:transform var(--dur-1) var(--ease-out)}
.mcard:hover .go svg{transform:translateX(3px)}
.mcard:hover{box-shadow:0 16px 40px -18px color-mix(in srgb,var(--ac) 45%,#000)}
.mcard .livebar{display:flex;align-items:center;gap:9px;margin:0 0 12px;font:600 12px var(--body);color:var(--ink-2)}
.mcard .livebar .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.mcard .livebar .spark{margin-left:auto;flex:none;opacity:.9}
.sdot.ok{background:var(--good)}.sdot.cond{background:var(--amber)}.sdot.no{background:var(--red)}
.att{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 26px}
.att .ach{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--body);padding:8px 13px;border-radius:999px;border:1px solid;cursor:pointer;background:none}
.att .ach.no{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));background:color-mix(in srgb,var(--red) 8%,transparent)}
.att .ach.cond{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--line));background:color-mix(in srgb,var(--amber) 8%,transparent)}
.att .ach svg{width:13px;height:13px}
.att .atl{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);align-self:center;margin-right:4px}
@media(max-width:480px){.mcard p{display:none}}

/* ── module INTRO cover ─────────────────────────────────────── */
.intro{min-height:calc(100vh - 52px);display:grid;padding:12vh 26px 40px;position:relative;overflow:hidden}
.intro .glow{position:absolute;inset:0;background:radial-gradient(58% 55% at 22% 14%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);pointer-events:none}
.intro-in{max-width:960px;width:100%;margin:0 auto;position:relative;display:grid;grid-template-columns:1.3fr .9fr;gap:44px;align-items:start}
@media(max-width:820px){.intro-in{grid-template-columns:1fr}.intro{padding-top:8vh}}
.intro .eb{font:600 12px var(--mono);letter-spacing:.2em;color:var(--acc);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.intro .eb .n{color:var(--ink-3)}
.intro h1{font-family:var(--disp);font-weight:800;font-size:clamp(32px,5.4vw,52px);line-height:1.04;margin:18px 0 14px;letter-spacing:-.5px}
.intro .tag{color:var(--ink-2);font-size:18px;margin:0 0 24px;max-width:460px}
.feat{list-style:none;padding:0;margin:0 0 30px;display:grid;gap:12px}
.feat li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-2);font-size:14.5px}
.feat .dot{margin-top:6px;width:8px;height:8px;border-radius:3px;background:var(--acc);flex:none}
.cta{display:inline-flex;align-items:center;gap:9px;background:var(--acc);color:#04120f;font-weight:600;font-size:14px;padding:12px 20px;border-radius:11px;border:0;cursor:pointer}
:root[data-theme="light"] .cta{color:#fff}
.intro-art{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 30px 60px -40px #000}
.intro-art .mini-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.intro-art .mini-h .d{width:9px;height:9px;border-radius:50%}
.intro-art .mini-h .d:nth-child(1){background:var(--red)}
.intro-art .mini-h .d:nth-child(2){background:var(--amber)}
.intro-art .mini-h .d:nth-child(3){background:var(--good)}

/* ── APP shell ─────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;padding:16px 12px;gap:16px}
.mrail{display:flex;gap:6px;flex-wrap:wrap}
.mrail a{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);border:1px solid transparent}
.mrail a svg{width:17px;height:17px}
.mrail a.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:color-mix(in srgb,var(--ac) 40%,var(--line))}
.mrail a:hover{color:var(--ink)}
.side .mname{font-family:var(--disp);font-weight:700;font-size:16px;padding:0 6px}
.side .mname small{display:block;font-family:var(--mono);font-weight:500;font-size:10px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:500}
.nav a svg{width:17px;height:17px;color:var(--ink-3)}
.nav a.on{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--ink)}
.nav a.on svg{color:var(--acc)}
.nav a:hover:not(.on){background:var(--card-2)}
.side .hubl{margin-top:auto;display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:12.5px;padding:8px 11px;border-top:1px solid var(--line)}
.side .hubl svg{width:15px;height:15px}

.main{min-width:0;display:flex;flex-direction:column}
.topb{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font:500 12.5px var(--mono);color:var(--ink-3);letter-spacing:.03em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--ink-3)}.crumb a:hover{color:var(--acc)}
.crumb b{color:var(--ink)}
.topb .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink-3);font-size:13px;min-width:0;flex:1;max-width:230px;cursor:pointer}
.topb .search svg{width:15px;height:15px;flex:none}
.topb .search .kbd{margin-left:auto;font:600 10px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink-3)}
.content{padding:22px;overflow:auto}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.phead:has(.sub){display:grid;grid-template-columns:1fr auto;gap:3px 14px;align-items:center}
.phead:has(.sub) .actions{grid-column:2;grid-row:1/span 2}
.phead h1,.phead h2{font-family:var(--disp);font-weight:700;font-size:24px;margin:0}
.phead .sub{color:var(--ink-3);font-size:12.5px}
.phead .actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);font:600 12.5px var(--body);padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:14px;height:14px}
.btn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.btn.pri{background:var(--acc);color:#04120f;border-color:var(--acc)}
:root[data-theme="light"] .btn.pri{color:#fff}
.btn.pri:hover{filter:brightness(1.05)}

/* banner / alert */
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:13.5px;border:1px solid}
.banner svg{width:18px;height:18px;flex:none}
.banner.no{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));background:color-mix(in srgb,var(--red) 10%,transparent)}
.banner.cond{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--line));background:color-mix(in srgb,var(--amber) 10%,transparent)}
.banner b{color:var(--ink)}
.banner .bx{margin-left:auto;font:600 12px var(--body);color:inherit;background:none;border:1px solid currentColor;border-radius:8px;padding:5px 11px;cursor:pointer;opacity:.8}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
:root[data-theme="light"] .kpi{box-shadow:0 1px 2px rgba(20,20,30,.05)}
.kpi .l{color:var(--ink-3);font-size:12px;font-weight:500;margin-bottom:9px}
.kpi .v{font-family:var(--body);font-weight:700;font-size:26px;line-height:1.1;font-feature-settings:var(--tnum);letter-spacing:-.3px}
.kpi.hero{background:color-mix(in srgb,var(--acc) 6%,var(--card));border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.kpi.hero .v{font-size:35px}
.kpi .d{margin-top:9px;font:600 11px var(--mono);display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px}
.kpi .d.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.kpi .d.down{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.kpi .d.flat{color:var(--ink-3);background:none;padding:3px 0}

.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(20,20,30,.05)}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card .ch h3{font-size:14px;font-weight:600;margin:0}
.card .ch .sp{margin-left:auto;font:600 11px var(--mono);color:var(--ink-3)}

/* bar chart */
.chartw{position:relative}
.grid{position:absolute;left:0;right:34px;top:8px;bottom:26px;pointer-events:none}
.grid i{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--line) 80%,transparent)}
.grid i b{position:absolute;right:-34px;top:-7px;font:500 9px var(--mono);color:var(--ink-3);font-style:normal;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:12px;height:172px;padding:8px 34px 0 0;border-bottom:1px solid var(--line);position:relative}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;cursor:default}
.bars .bar .col{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 68%,transparent));min-height:8px;transform-origin:bottom;animation:colin .45s var(--ease-out) both;animation-delay:calc(var(--i)*40ms);transition:filter .15s ease}
.bars .bar:hover .col{filter:brightness(1.18)}
.bars .bar.mx .col{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 78%,transparent));box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}
.bars .bar .bl{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.2}
.bars .bar .bv{font:600 11px var(--mono);color:var(--ink-2);font-feature-settings:var(--tnum)}
@keyframes colin{from{transform:scaleY(0)}}
.ctip{position:fixed;z-index:90;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font:600 12px var(--body);color:var(--ink);box-shadow:0 12px 30px -12px #000;pointer-events:none;white-space:nowrap}
.ctip small{display:block;font:500 10.5px var(--mono);color:var(--ink-3)}
/* segarea */
.segrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.segrow .note{margin-left:auto;font:500 10px var(--mono);color:var(--ink-3)}

.area{width:100%;height:150px;display:block}

/* donut */
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:84px;height:84px;flex:none}
.donut circle:last-of-type{animation:donin .7s var(--ease-out) both}
@keyframes donin{from{stroke-dashoffset:264}}
.donut .dl{font-size:12.5px;color:var(--ink-2)}
.lgd{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.lgd .lr{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
.lgd .lr i{width:9px;height:9px;border-radius:3px;flex:none}
.lgd .lr b{margin-left:auto;font:600 12px var(--mono);color:var(--ink);font-feature-settings:var(--tnum)}
/* widgets */
.wrow{margin-top:16px}
.icards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.icards{grid-template-columns:1fr}}
.icard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tone);border-radius:var(--r);padding:15px 16px}
.icard b{display:block;font-size:13.5px;margin-bottom:5px}
.icard small{color:var(--ink-3);font-size:12px}
.hm{display:grid;gap:4px;overflow-x:auto}
.hm .hrow{display:grid;grid-template-columns:110px repeat(6,1fr);gap:4px;align-items:center;min-width:480px}
.hm .hl{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm .cell{height:30px;border-radius:6px;display:grid;place-items:center;font:600 10.5px var(--mono);color:var(--ink);font-feature-settings:var(--tnum)}
.hm .mh{font:600 9.5px var(--mono);color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.hm-note{margin-top:10px;font:500 10.5px var(--mono);color:var(--ink-3)}
.gantt{display:flex;flex-direction:column;gap:9px}
.gantt .grow{display:grid;grid-template-columns:52px 1fr 92px;gap:12px;align-items:center}
.gantt .gl{font:600 11px var(--mono);color:var(--ink-2)}
.gantt .gtrack{height:14px;border-radius:7px;background:var(--card-2);overflow:hidden}
.gantt .gfill{height:100%;border-radius:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 70%,transparent),var(--acc));transition:width .5s var(--ease-out)}
.gantt .gst{font:600 10px var(--mono);color:var(--ink-3)}
.dcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.dcards{grid-template-columns:1fr}}
.dcard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--card-2)}
.dcard .dt{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.dcard .dt b{font-size:13px}
.dcard small{color:var(--ink-3);font-size:11.5px}
/* mini table widget */
.mtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mtbl td{padding:9px 10px;border-top:1px solid var(--line);color:var(--ink-2)}
.mtbl tr:first-child td{border-top:0}
.mtbl td b{color:var(--ink)}
.mtbl tr[data-go]{cursor:pointer}
.mtbl tr[data-go]:hover td{background:var(--card-2)}

/* mini rows */
.rows{display:flex;flex-direction:column}
.rows .rw{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:13px}
.rows .rw:first-child{border-top:0}
.rows .rw .t{flex:1;min-width:0}
.rows .rw .t b{display:block;font-weight:600}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
:root[data-theme="light"] .tbl-wrap{box-shadow:0 1px 2px rgba(20,20,30,.05)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{text-align:left;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card-2)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink-2)}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--card-2);transition:background .12s}
table.t tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
table.t td b{color:var(--ink);font-weight:600}
table.t td.n{font-family:var(--mono);font-feature-settings:var(--tnum);text-align:right}
table.t th.n{text-align:right}
.kebab{opacity:0;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1;transition:opacity .15s}
table.t tbody tr:hover .kebab,.kebab:focus-visible{opacity:1}
.plnw{display:inline-flex;align-items:center;gap:8px}
.plnbar{width:44px;height:6px;border-radius:4px;background:var(--card-2);overflow:hidden;flex:none}
.plnbar i{display:block;height:100%;border-radius:4px}
.tr-up{color:var(--good);font-weight:700}.tr-dn{color:var(--red);font-weight:700}.tr-fl{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--body);padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.badge.cond{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.badge.no{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.badge.q{color:var(--ink-3);background:color-mix(in srgb,var(--ink-3) 16%,transparent)}
.badge.info{color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent)}
/* priorita = orámovaná, aby sa nemýlila so stavom */
.badge.prio{background:transparent;border:1px solid currentColor;padding:2px 9px}
.badge.prio::before{display:none}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:220px}
.tsearch svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.tsearch input{border:0;background:none;outline:none;color:var(--ink);font:500 13px var(--body);width:100%}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font:600 12px var(--body);padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);cursor:pointer;background:none}
.chip.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,transparent)}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:14px;color:var(--ink-3);font:600 12px var(--mono)}
.pager button{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:none;color:inherit;cursor:pointer;font:inherit}
.pager button.on{color:var(--acc);border-color:var(--acc)}

/* empty state */
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--card) 60%,transparent)}
.empty .ei{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin:0 auto 16px;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.empty .ei svg{width:26px;height:26px}
.empty h3{font-family:var(--disp);font-weight:700;font-size:19px;margin:0 0 6px}
.empty p{color:var(--ink-3);font-size:13.5px;margin:0 auto 18px;max-width:340px}

/* detail */
.dcols{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media(max-width:900px){.dcols{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
.field{padding:11px 0;border-bottom:1px solid var(--line)}
.field .fl{color:var(--ink-3);font-size:11.5px;margin-bottom:3px}
.field .fv{font-size:14px;font-weight:500}
.time{display:flex;flex-direction:column;gap:0}
.time .ti{display:flex;gap:13px;padding:10px 0}
.time .ti .mk{position:relative;flex:none;width:12px}
.time .ti .mk::before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.time .ti .mk::after{content:"";position:absolute;left:6px;top:13px;bottom:-10px;width:1px;background:var(--line)}
.time .ti:last-child .mk::after{display:none}
.time .ti .tt{font-size:13px}
.time .ti .tt small{display:block;color:var(--ink-3);font:500 11px var(--mono);margin-top:2px}
.addstep{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.addstep input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font:500 13px var(--body);color:var(--ink);outline:none}
.addstep input:focus{border-color:var(--acc)}

/* settings */
.set-group{margin-bottom:16px}
.set-group>.gh{font-size:13.5px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.set-group>.gh svg{width:16px;height:16px;color:var(--acc)}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .sl{flex:1}
.set-row .sl b{display:block;font-size:13.5px;font-weight:500}
.set-row .sl small{color:var(--ink-3);font-size:12px}
.sw{width:42px;height:24px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:.16s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--acc) 30%,transparent);border-color:var(--acc)}
.sw[aria-checked="true"]::after{left:20px;background:var(--acc)}
.selbox{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;font:500 13px var(--body);color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.selbox svg{width:14px;height:14px;color:var(--ink-3)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--card-2) 25%,color-mix(in srgb,var(--card-2) 55%,var(--ink-3)) 37%,var(--card-2) 63%);background-size:400% 100%;animation:shimmer 1.2s ease infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-row{height:52px;margin-bottom:8px}
.sk-kpi{height:92px}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:11px;padding:12px 15px;font-size:13px;color:var(--ink);box-shadow:0 18px 40px -20px #000;animation:tin .25s ease both;max-width:320px}
.toast svg{width:16px;height:16px;color:var(--good);flex:none}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* overlay / dropdown */
.scrim{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,#000 45%,transparent)}
.dropdown{position:fixed;top:56px;z-index:75;width:320px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px -24px #000;overflow:hidden;animation:tin .16s ease both}
.dropdown .dh{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.dropdown .dh .sp{margin-left:auto;font:600 11px var(--mono);color:var(--ink-3)}
.nitem{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.nitem:last-child{border-bottom:0}
.nitem .nd{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.nitem .nt{font-size:13px}
.nitem .nt small{display:block;color:var(--ink-3);font:500 11px var(--mono);margin-top:2px}
.mitem{display:flex;align-items:center;gap:11px;padding:11px 16px;font-size:13.5px;color:var(--ink-2);cursor:pointer;background:none;border:0;width:100%;text-align:left;font-family:inherit;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:0}
.mitem:hover{background:var(--card-2);color:var(--ink)}
.mitem svg{width:16px;height:16px;color:var(--ink-3)}
.muser{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.muser .avatar{cursor:default}
.muser b{display:block;font-size:13.5px}.muser small{color:var(--ink-3);font-size:12px}

/* command palette */
.cmdk{position:fixed;top:12vh;left:50%;transform:translateX(-50%);z-index:75;width:560px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -20px #000;overflow:hidden;animation:tin .16s ease both}
.cmdk .ci{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.cmdk .ci svg{width:18px;height:18px;color:var(--ink-3)}
.cmdk .ci input{flex:1;border:0;background:none;outline:none;color:var(--ink);font:500 15px var(--body)}
.cmdk .cres{max-height:340px;overflow:auto}
.cmdk .cr{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.cmdk .cr:hover{background:var(--card-2)}
.cmdk .cr .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent);flex:none}
.cmdk .cr .ic svg{width:16px;height:16px}
.cmdk .cr .ct b{font-size:13.5px}.cmdk .cr .ct small{display:block;color:var(--ink-3);font-size:11.5px}
.cmdk .cr .kind{margin-left:auto;font:600 10px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.cmdk .cempty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:13px}

/* modal */
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:75;width:480px;max-width:calc(100vw - 24px);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -20px #000;animation:tin .18s ease both}
.modal .mh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-family:var(--disp);font-size:19px;margin:0}
.modal .mh .x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.fgroup label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px;font-weight:500}
.fgroup input,.fgroup select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;font:500 13.5px var(--body);color:var(--ink);outline:none}
.fgroup input:focus,.fgroup select:focus{border-color:var(--acc)}
.modal .mf{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* auth / profile */
.auth{min-height:calc(100vh - 52px);display:grid;grid-template-columns:1.05fr .95fr}
@media(max-width:820px){.auth{grid-template-columns:1fr}.auth .aside-brand{display:none}}
.auth .aside-brand{position:relative;overflow:hidden;padding:56px 48px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,color-mix(in srgb,var(--teal) 12%,var(--paper)),var(--paper))}
.auth .aside-brand .glow{position:absolute;inset:0;background:radial-gradient(50% 50% at 30% 30%,color-mix(in srgb,var(--teal) 20%,transparent),transparent 70%)}
.auth .aside-brand h1{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1.08;margin:20px 0 14px;position:relative}
.auth .aside-brand h1 em{color:var(--teal);font-style:normal}
.auth .aside-brand p{color:var(--ink-2);font-size:16px;max-width:420px;position:relative}
.auth .apane{display:grid;place-items:center;padding:40px 26px}
.auth .acard{width:100%;max-width:360px}
.auth .acard .eb{font:600 11px var(--mono);letter-spacing:.2em;color:var(--teal);text-transform:uppercase}
.auth .acard h2{font-family:var(--disp);font-weight:700;font-size:26px;margin:10px 0 22px}
.auth .acard .fgroup{margin-bottom:14px}
.auth .acard .lbtn{width:100%;justify-content:center;margin-top:6px}
.auth .wslist{display:grid;gap:10px;margin-top:6px}
.ws{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:inherit;color:inherit}
.ws:hover{border-color:var(--teal)}
.ws .wi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#fff;flex:none}
.ws b{display:block;font-size:14px}.ws small{color:var(--ink-3);font-size:12px}
.ws .go{margin-left:auto;color:var(--ink-3)}
.profile-wrap{max-width:760px;margin:0 auto;padding:40px 26px}

.an{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── mobil ─────────────────────────────────────────────────── */
@media(max-width:820px){
  .hamb{display:grid}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:52px;bottom:0;left:0;width:250px;z-index:55;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px -10px #000}
  body.drawer .side{transform:none}
  .drawer-scrim{display:none;position:fixed;top:52px;inset:52px 0 0 0;background:color-mix(in srgb,#000 50%,transparent);backdrop-filter:blur(4px);z-index:54}
  body.drawer .drawer-scrim{display:block}
  .topb .search{max-width:none}
}
@media(min-width:821px){.drawer-scrim{display:none}}
@media(max-width:520px){
  .demo-tag{display:none}
  .topb .search{order:5;flex-basis:100%;max-width:none}
  .content{padding:16px}
}

@media print{
  .gbar,.hamb,.drawer-scrim{display:none}.view{padding-top:0}
  .card,.kpi,.tbl-wrap{break-inside:avoid}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .shell{min-height:0}
}

/* ══ i1.css ══ */
/* ═ I1 KONEKTOR — Shop API (len nové CSS pravidlá, prefix .cn-) ═ */

/* ── LIVE pilulka v .gbar (pred .gspace) ─────────────────────── */
.cn-pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
.cn-pill:hover{color:var(--ink);border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.cn-pill .cn-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.cn-pill[data-st="live"] .cn-dot{background:var(--good);animation:cn-pulse 2.2s ease-in-out infinite}
.cn-pill[data-st="stale"] .cn-dot{background:var(--amber)}
.cn-pill[data-st="error"] .cn-dot{background:var(--red)}
.cn-pill[data-st="demo"] .cn-dot{background:var(--ink-3)}
.cn-pill[data-st="error"]{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.cn-pill[data-st="stale"]{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,var(--line))}
@keyframes cn-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
@media(max-width:640px){.cn-pill{padding:0 9px}.cn-pill .cn-txt{display:none}}

/* ── mikro-glyf „● live 09:41" na KPI kartách a grafoch ──────── */
.cn-glyph{display:inline-flex;align-items:center;gap:4px;font:600 10px var(--mono);letter-spacing:.04em;white-space:nowrap;color:var(--good);cursor:help}
.cn-glyph.cn-stale{color:var(--amber)}
.cn-glyph.cn-error{color:var(--red)}
.cn-glyph.cn-demo{color:var(--ink-3)}
.cn-glyph.cn-off{color:var(--ink-3);opacity:.75}          /* outage → glyf zošedne */
.kpi:has(.cn-glyph){position:relative}
.kpi>.cn-glyph{position:absolute;top:13px;right:15px}
.ch .cn-glyph.cn-chg{margin-left:auto}

/* skeleton hodnoty počas syncu (kombinuje sa s existujúcou .sk) */
.cn-sk{display:inline-block;width:120px;height:24px;border-radius:6px;vertical-align:middle}

/* ── dropdown konektora (vnútro existujúceho .dropdown) ──────── */
.cn-ep{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cn-ep .cn-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.cn-dot.cn-live{background:var(--good)}
.cn-dot.cn-stale{background:var(--amber)}
.cn-dot.cn-error{background:var(--red)}
.cn-dot.cn-demo{background:var(--ink-3)}
.cn-ep .cn-et{flex:1;min-width:0}
.cn-ep .cn-et b{display:block;font-size:12.5px;font-weight:600}
.cn-ep .cn-et small{display:block;font:500 10px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn-ep .cn-ago{font:600 10.5px var(--mono);color:var(--ink-3);white-space:nowrap;flex:none}
.cn-foot{display:flex;gap:10px;padding:12px 16px 8px}
.cn-foot .btn{flex:1;justify-content:center}
.cn-note{font:500 10px var(--mono);color:var(--ink-3);padding:0 16px 10px;border-bottom:1px solid var(--line)}
/* „skrytý" prepínač Simulovať výpadok — zámerne nenápadný */
.cn-hid{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:11.5px;color:var(--ink-3);opacity:.8}
.cn-hid:hover{opacity:1}
.cn-hid .sl{flex:1}
.cn-hid .sw{transform:scale(.85);transform-origin:right center}

/* ══ i2.css ══ */
/* ═ I2 IMPORT+REPORT — štýly (.iw- import wizard + UX, .rb- report builder) ═ */

/* ── import wizard modal (rozšírenie .modal 480 → 720) ─────── */
.iw-modal,.rb-modal{width:720px}
.iw-steps{display:flex;gap:6px;padding:14px 20px 0;border-bottom:1px solid var(--line)}
.iw-step{flex:1;display:flex;align-items:center;gap:8px;padding:6px 0 14px;color:var(--ink-3);font:600 12px var(--body);min-width:0}
.iw-step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw-step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:600 11px var(--mono);font-style:normal;flex:none}
.iw-step.on{color:var(--ink)}
.iw-step.on i{background:var(--acc);border-color:var(--acc);color:#04120f}
:root[data-theme="light"] .iw-step.on i{color:#fff}
.iw-step.done{color:var(--acc)}
.iw-step.done i{border-color:var(--acc);color:var(--acc)}
@media(max-width:640px){.iw-step span{display:none}}

.iw-drop{display:flex;align-items:center;gap:12px;padding:24px 18px;border:1px dashed var(--line);border-radius:12px;justify-content:center;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
.iw-note{font:500 11.5px var(--mono);color:var(--ink-3)}
.iw-err{color:var(--red);font-size:12px}

.iw-tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card-2)}
.iw-tbl{width:100%;border-collapse:collapse;font-size:12px}
.iw-tbl th{text-align:left;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.iw-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.iw-tbl tr:last-child td{border-bottom:0}

.iw-map{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.iw-map:last-of-type{border-bottom:0}
.iw-map label{font-size:13px;font-weight:500;color:var(--ink)}
.iw-map label em{display:block;font:500 10.5px var(--mono);color:var(--ink-3);font-style:normal;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw-map select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;font:500 13px var(--body);color:var(--ink);outline:none}
.iw-map select:focus{border-color:var(--acc)}
.iw-map select.iw-auto-hit{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}

.iw-skip{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--body);color:var(--ink-2);cursor:pointer}
.iw-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.iw-sum .kpi .v{font-size:22px}

/* ── „Posledný import" riadok pod toolbarom ────────────────── */
.iw-last{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:9px 14px;border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--acc) 7%,var(--card));font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.iw-last svg{color:var(--acc);flex:none}
.iw-last b{color:var(--ink)}
.iw-last .btn{margin-left:auto;padding:5px 10px;font-size:11.5px}

/* ── popover (Filter chips + prepínač obdobia) ─────────────── */
.iw-pop{position:fixed;z-index:76;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px -18px #000;min-width:210px;max-width:300px;overflow:hidden;animation:tin .15s ease both}
.iw-pop-h{padding:10px 14px 2px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.iw-pop .chips{padding:10px 12px 12px}
.iw-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;font:500 13px var(--body);color:var(--ink-2);cursor:pointer;font-family:inherit}
.iw-item:last-child{border-bottom:0}
.iw-item:hover:not([disabled]){background:var(--card-2);color:var(--ink)}
.iw-item.on{color:var(--acc)}
.iw-item[disabled]{color:var(--ink-3);opacity:.65;cursor:not-allowed;font-size:11.5px}

/* ── triedenie tabuliek ────────────────────────────────────── */
.iw-th{cursor:pointer;user-select:none}
.iw-th:hover{color:var(--ink)}
.iw-arr{margin-left:5px;font-size:9px;color:var(--acc)}

/* ── badge „auto z API" vo formulári Vyplň mesiac ──────────── */
.iw-auto{display:inline-flex;margin-left:6px;font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 40%,var(--line));border-radius:20px;padding:1px 7px;background:color-mix(in srgb,var(--violet) 10%,transparent);vertical-align:middle}

/* ── report builder ────────────────────────────────────────── */
.rb-grid{display:grid;grid-template-columns:252px 1fr;gap:16px;align-items:start}
@media(max-width:760px){.rb-grid{grid-template-columns:1fr}}
.rb-secs{display:flex;gap:8px;flex-wrap:wrap}
.rb-chk{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--body);color:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.rb-chk:has(input:checked){color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 8%,transparent)}
.rb-fmt,.rb-plan{display:flex;gap:8px;flex-wrap:wrap}
.rb-plan select,.rb-plan input{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 10px;font:500 12.5px var(--body);color:var(--ink);outline:none}
.rb-plan select:focus,.rb-plan input:focus{border-color:var(--acc)}

.rb-prev{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:16px;max-height:56vh;overflow:auto}
.rb-head{font-family:var(--disp);font-weight:700;font-size:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rb-head small{display:block;font:500 11px var(--mono);color:var(--ink-3);margin-top:3px}
.rb-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.rb-kpi{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card)}
.rb-kpi small{display:block;color:var(--ink-3);font-size:10.5px;margin-bottom:3px}
.rb-kpi b{font-size:16px;font-feature-settings:var(--tnum)}
.rb-sec-t{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
.rb-tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rb-prev table.t{min-width:0;font-size:11.5px}
.rb-prev table.t th,.rb-prev table.t td{padding:8px 10px}
.rb-prev table.t tbody tr{cursor:default}
.rb-ai ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rb-ai li{font-size:12.5px;color:var(--ink-2)}
.rb-ai li::marker{color:var(--acc)}

/* ── tlačová verzia reportu ────────────────────────────────── */
.rb-print{display:none}
@media print{
  body.rb-printing .gbar,body.rb-printing #view,body.rb-printing .toasts,
  body.rb-printing .modal,body.rb-printing .scrim,body.rb-printing .dropdown{display:none!important}
  body.rb-printing .rb-print{display:block!important;padding:10mm}
  body.rb-printing .rb-print .rb-prev,body.rb-printing .rb-print{max-height:none;overflow:visible}
}

/* ══ i3.css ══ */
/* ═ I3 AURAAI CHAT — FAB + dokovaný panel + správy + citácie ═ */

/* ── FAB s korunkou (modulové stránky, pod .toasts z-index 80) ── */
.ai-fab{
  position:fixed;right:18px;bottom:18px;z-index:79;
  width:52px;height:52px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));
  background:linear-gradient(135deg,var(--gold),var(--gold-t));
  color:#221806;display:none;place-items:center;cursor:pointer;
  box-shadow:0 14px 32px -14px #000;
  transition:transform var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out);
}
.ai-fab svg{width:24px;height:24px}
.ai-fab:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 18px 40px -14px color-mix(in srgb,var(--gold) 60%,#000)}
:root[data-theme="light"] .ai-fab{color:#3a2c08}
/* toasty vyskočia nad FAB, aby sa neprekrývali */
body.ai-fab-on .toasts{bottom:86px}

/* ── dokovaný pravý panel 360 px ───────────────────────────── */
.ai-panel{
  position:fixed;top:52px;right:0;bottom:0;width:360px;z-index:79;
  background:var(--card);border-left:1px solid var(--line);
  display:none;flex-direction:column;
  box-shadow:-18px 0 40px -30px #000;
  animation:ai-in .2s var(--ease-out) both;
}
body.ai-open .ai-panel{display:flex}
@keyframes ai-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media(min-width:821px){
  body.ai-open .main{margin-right:360px}
  body.ai-open .toasts{right:378px}
}
@media(max-width:820px){
  /* mobil: fullscreen sheet */
  .ai-panel{left:0;width:auto;box-shadow:none}
}

/* hlavička */
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.ai-crown-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);flex:none}
.ai-crown-ic svg{width:19px;height:19px}
.ai-ht{min-width:0;flex:1}
.ai-ht b{display:block;font-size:13.5px}
.ai-ht small{display:block;font:500 10.5px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;flex:none}
.ai-x:hover{color:var(--ink);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.ai-x svg{width:14px;height:14px}

/* telo — správy */
.ai-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:90%;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.45;color:var(--ink)}
.ai-msg.ai-u{align-self:flex-end;background:color-mix(in srgb,var(--acc) 16%,var(--card-2));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-bottom-right-radius:4px}
.ai-msg.ai-a{align-self:flex-start;background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-tag{display:block;font:600 9px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:3px}

/* povinná citácia pod odpoveďou */
.ai-cite{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font:600 10.5px var(--mono);color:var(--ink-3)}
.ai-cite i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.ai-cite.ai-c-live i{background:var(--good)}
.ai-cite.ai-c-stale i{background:var(--amber)}
.ai-cite.ai-c-outage i{background:var(--red)}
.ai-cite.ai-c-import i{background:var(--violet)}

/* max 1 akčné tlačidlo */
.ai-act{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:8px;padding:6px 11px;cursor:pointer}
.ai-act svg{width:13px;height:13px}
.ai-act:hover{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.ai-act:active{transform:translateY(1px)}

/* typing skeleton (využíva globálny .sk shimmer) */
.ai-typing{align-self:flex-start;width:70%;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.ai-typing .sk{height:12px}
.ai-typing .sk:last-child{width:62%}

/* navrhované otázky (chips) */
.ai-sugg{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.ai-chip{font:600 11.5px var(--body);padding:6px 11px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);cursor:pointer;background:none;text-align:left}
.ai-chip:hover{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 8%,transparent)}
.ai-fbchips{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px}

/* vstupný riadok */
.ai-inrow{flex:none;display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.ai-inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font:500 13px var(--body);color:var(--ink);outline:none}
.ai-inrow input:focus{border-color:var(--gold)}
.ai-send{width:38px;height:38px;border-radius:10px;border:0;background:var(--gold);color:#221806;cursor:pointer;display:grid;place-items:center;flex:none}
.ai-send:hover{filter:brightness(1.06)}
.ai-send:active{transform:translateY(1px)}
.ai-send svg{width:16px;height:16px}
:root[data-theme="light"] .ai-send{color:#3a2c08}

@media print{.ai-fab,.ai-panel{display:none!important}body.ai-open .main{margin-right:0}}

/* ── W1: modelky (karty identity) ───────────────────────────── */
.mdlg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.mdlg{grid-template-columns:1fr}}
.mdl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mdl:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.mdl .mdh{display:flex;align-items:center;gap:12px}
.mdl .av{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;font:700 15px var(--disp);color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line))}
.mdl .mdt{min-width:0;flex:1}
.mdl .mdt b{display:block;font-size:14.5px}
.mdl .mdt small{display:block;font:500 11px var(--mono);color:var(--ink-3)}
.mdl .mdf{display:grid;gap:7px}
.mdl .mdr{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.mdl .mdr span{color:var(--ink-3);min-width:78px}
.mdl .mdr b{color:var(--ink-2);font-weight:600}
.mdl .mdc{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.mdl .mdc i{font:600 10.5px var(--mono);font-style:normal;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px}

/* ── W2: matica copy manifestov ──────────────────────────────── */
.mfx{display:grid;gap:4px;overflow-x:auto}
.mfx .mfr{display:grid;grid-template-columns:72px repeat(5,1fr);gap:4px;align-items:center;min-width:540px}
.mfx .mfh{font:600 9.5px var(--mono);color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.mfx .mfl{font:600 11.5px var(--mono);color:var(--ink-2)}
.mfx .mfc{height:34px;border-radius:7px;border:1px solid transparent;display:grid;place-items:center;font:600 10px var(--mono);color:var(--ink);cursor:pointer;padding:0;background:var(--card-2)}
.mfx .mfc.s2{background:color-mix(in srgb,var(--good) 26%,var(--card-2))}
.mfx .mfc.s1{background:color-mix(in srgb,var(--amber) 26%,var(--card-2))}
.mfx .mfc.s0{background:color-mix(in srgb,var(--ink-3) 14%,var(--card-2));color:var(--ink-3)}
.mfx .mfc.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent)}
.mfe{display:grid;gap:12px}
.mfe .mfrow{display:grid;gap:6px}
.mfe label{font-size:12px;color:var(--ink-3);font-weight:500}
.mfe input,.mfe .ro{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;font:500 13.5px var(--body);color:var(--ink);outline:none}
.mfe input:focus{border-color:var(--acc)}
.mfe .ro{color:var(--ink-2);background:var(--card-2)}
.mfe .cnt{font:500 10.5px var(--mono);color:var(--ink-3)}

/* ── W3: znalostná báza ──────────────────────────────────────── */
.kbg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.kbg{grid-template-columns:1fr}}
.kbc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tone);border-radius:var(--r);padding:15px 16px}
.kbc .kbh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.kbc .kbh b{font-size:13.5px}
.kbc .kbh .cat{margin-left:auto;font:600 9.5px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.kbc p{font-size:12.5px;color:var(--ink-2);margin:0 0 9px;line-height:1.5}
.kbc .kbm{display:flex;flex-wrap:wrap;gap:12px;font:500 10.5px var(--mono);color:var(--ink-3)}

/* ── W4: denníky (taby) ──────────────────────────────────────── */
.dnk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dnk-h .note{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink-3)}

/* ══════════════════════════════════════════════════════════════
   aura-ai.html — komponenty, ktoré základ (aura-apps-hub.html) nemá:
   chatové rozhranie, kanban, graf pamäte, blok kódu, karty, formulár.
   Základ CSS sa vkladá skriptom assemble.mjs 1:1 z hubu, aby bola
   vizuálna identita rodiny zaručená a nie prepísaná.
   ══════════════════════════════════════════════════════════════ */

/* akcenty nových appiek — akcent hovorí „v ktorej appke som",
   stavová farba (good/amber/red) hovorí „je toto číslo dobré" */
:root{
  --b-mind:#6a7de8;    /* Aura AI (8082) — indigo · dark 5,1:1 */
  --b-chat:#c9457a;    /* AuraAI Chat — malinová · dark 4,6:1 / light 4,1:1 */
  --b-ban:#4fa8e0;     /* Banner Studio (8091) — azúrová · dark 6,7:1 */
  --b-ret:#c97fd8;     /* Retouch Studio (8092) — orchidea, sýtosťou odlíšená od --b-hr */
  --b-shop:#9bb84a;    /* sperky-ai (3000) — olivová, teplejšia než --b-fin */
  --b-hub:#8a6a3a;     /* Aura Hub (3050) — bronzová, tmavšia než --gold */
}

/* 6 appiek sa musí zmestiť do jedného riadku railu (230 px panel) */
.mrail{gap:4px}
.mrail a{width:30px;height:30px}
.mrail a svg{width:16px;height:16px}

/* ── generické bloky ────────────────────────────────────────── */
.blocks{display:grid;gap:16px}
.b2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.b2,.b3{grid-template-columns:1fr}}

/* karty s riadkami údajov */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:11px}
:root[data-theme="light"] .gcard{box-shadow:0 1px 2px rgba(20,20,30,.05)}
.gcard .gh{display:flex;align-items:flex-start;gap:10px}
.gcard .gt{min-width:0;flex:1}
.gcard .gt b{display:block;font-size:14px;line-height:1.35}
.gcard .gt small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.gcard .gl{display:grid;gap:6px}
.gcard .gr{display:flex;gap:10px;font-size:12.5px;align-items:baseline}
.gcard .gr span{color:var(--ink-3);min-width:96px;flex:none}
.gcard .gr b{color:var(--ink-2);font-weight:600;min-width:0;word-break:break-word}
.gcard .gc{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.gcard .gc i{font:600 10.5px var(--mono);font-style:normal;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px}

/* zoznam */
.glist{display:flex;flex-direction:column}
.glist .gi{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.glist .gi:first-child{border-top:0}
.glist .gi .gx{min-width:0;flex:1}
.glist .gi .gx b{display:block;font-size:13.5px;font-weight:600}
.glist .gi .gx small{display:block;color:var(--ink-3);font-size:12px}
.glist .gi .gm{font:600 10.5px var(--mono);color:var(--ink-3);flex:none}

/* kanban */

const svg=(p,w=18)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[p]||p}</svg>`;

/* ── grafy (ručné SVG/CSS) ─────────────────────────────────── */
function bars(data){
  const max=Math.max(...data.map(d=>d.v||0),1);
  const grid=[75,50,25].map(p=>`<i style="top:${100-p}%"><b>${decs(Math.round(max*p/100*10)/10)}</b></i>`).join('');
  return `<div class="chartw"><div class="grid">${grid}</div><div class="bars">${data.map((d,i)=>`<div class="bar${d.v===max?' mx':''}">
    <span class="bv">${grp(d.v)}</span><div class="col" style="height:${Math.max(6,d.v/max*100)}%;--i:${i}"></div>
    <span class="bl">${tr(d.l)}</span></div>`).join('')}</div></div>`;
}
let _ag=0;
function lines(pg){
  const W=560,H=170,pad=8,n=pg.labels.length;
  const all=pg.series.flatMap(s=>s.v),mx=Math.max(...all),mn=Math.min(...all),rng=(mx-mn)||1;
  const X=i=>pad+i*(W-2*pad)/Math.max(1,n-1), Y=v=>H-18-((v-mn)/rng)*(H-40);
  const path=vs=>vs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const mavg=vs=>vs.map((_,i)=>{const a=vs.slice(Math.max(0,i-2),i+1);return a.reduce((s,x)=>s+x,0)/a.length;});
  const p=pg.series.map(s=>`<path d="${path(s.v)}" fill="none" stroke="${s.color||'var(--acc)'}" stroke-width="2" stroke-linejoin="round"/>`).join('');
  const av=pg.avg?`<path d="${path(mavg(pg.series[0].v))}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="5 4"/>`:'';
  const lb=pg.labels.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">${esc(tr(l))}</text>`).join('');
  const lg=`<div class="lgd" style="flex-direction:row;flex-wrap:wrap;gap:14px">${pg.series.map(s=>`<div class="lr" style="gap:6px"><i style="background:${s.color||'var(--acc)'}"></i><span>${esc(tr(s.l))}</span></div>`).join('')}${pg.avg?`<div class="lr" style="gap:6px"><i style="background:var(--ink-3)"></i><span>${state.lang==='sk'?'kĺzavý priemer':'moving average'}</span></div>`:''}</div>`;
  return `<svg class="area" style="height:${H}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${p}${av}${lb}</svg>${lg}`;
}
function donut(v,label){
  const r=42,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,v))/100);
  return `<div class="donut"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--card-2)" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>
    <div><div style="font:700 26px var(--body);font-feature-settings:var(--tnum)">${decs(v)}${state.lang==='sk'?NBSP+'%':'%'}</div>
    <div class="dl">${esc(tr(label))}</div></div></div>`;
}

/* ── generický renderer blokov ─────────────────────────────── */
function cellHTML(c,i){
  if(c&&c.pln!==undefined){const v=c.pln,tok=v>=100?'var(--good)':v>=60?'var(--amber)':'var(--red)';
    return `<td><span class="plnw"><span class="plnbar"><i style="width:${Math.min(v,100)}%;background:${tok}"></i></span>
      <span class="n" style="font-family:var(--mono)">${decs(v)}${NBSP}%</span></span></td>`;}
  if(Array.isArray(c))return `<td><span class="badge ${esc(c[0])}">${esc(tr(c[1]))}</span></td>`;
  const s=fmtCell(c);
  const num=isNum(c)||(typeof s==='string'&&/^[~≈−+€—-]?[\d\s.,:%€/hms -]+$/.test(s)&&/\d/.test(s));
  return `<td class="${num?'n':''}">${i===0?`<b>${esc(s)}</b>`:esc(s)}</td>`;
}
function kpiCard(k){
  const v=(k.v&&k.v.t)?fmtCell(k.v):tr(k.v);
  const tone=k.tone?`<div class="d ${k.tone==='ok'?'up':k.tone==='no'?'down':'flat'}">${k.tone==='ok'?'OK':k.tone==='no'?(state.lang==='sk'?'pozor':'alert'):(state.lang==='sk'?'sleduj':'watch')}</div>`:'';
  return `<div class="kpi"><div class="l">${esc(tr(k.l))}</div><div class="v">${esc(v)}</div>
    ${k.sub?`<div class="d flat">${esc(tr(k.sub))}</div>`:tone}</div>`;
}
function mdLite(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .split('\n\n').map(par=>{
      const ls=par.split('\n');
      if(ls.every(l=>/^[-•]\s/.test(l)))return '<ul>'+ls.map(l=>`<li>${l.replace(/^[-•]\s/,'')}</li>`).join('')+'</ul>';
      return `<p>${ls.join('<br>')}</p>`;
    }).join('');
}
function block(b){
  switch(b.t){
    case 'kpis':return `<div class="kpis" style="margin-bottom:0">${b.items.map(kpiCard).join('')}</div>`;
    case 'bars':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div>${bars(b.data)}${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
    case 'lines':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div>${lines(b)}${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
    case 'donut':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div>${donut(b.pct,b.label)}${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
    case 'table':return `${b.title?`<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div>`:''}
      <div class="tbl-wrap"${b.title?' style="border:0;background:none"':''}><table class="t"><thead><tr>${b.cols.map(c=>`<th scope="col">${esc(tr(c))}</th>`).join('')}</tr></thead>
      <tbody>${b.rows.map(r=>`<tr style="cursor:default">${r.c.map(cellHTML).join('')}</tr>`).join('')}</tbody></table></div>
      ${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}${b.title?'</div>':''}`;
    case 'cards':return `<div class="b${b.n===2?'2':'3'}">${b.items.map(it=>`<div class="gcard">
      <div class="gh"><div class="gt"><b>${esc(tr(it.title))}</b>${it.sub?`<small>${esc(tr(it.sub))}</small>`:''}</div>
        ${it.badge?`<span class="badge ${esc(it.badge[0])}">${esc(tr(it.badge[1]))}</span>`:''}</div>
      ${it.lines&&it.lines.length?`<div class="gl">${it.lines.map(l=>`<div class="gr"><span>${esc(tr(l[0]))}</span><b>${esc(tr(l[1]))}</b></div>`).join('')}</div>`:''}
      ${it.chips&&it.chips.length?`<div class="gc">${it.chips.map(c=>`<i>${esc(tr(c))}</i>`).join('')}</div>`:''}</div>`).join('')}</div>`;
    case 'list':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div><div class="glist">${b.items.map(it=>`<div class="gi">
      <div class="gx"><b>${esc(tr(it.title))}</b>${it.sub?`<small>${esc(tr(it.sub))}</small>`:''}</div>
      ${it.badge?`<span class="badge ${esc(it.badge[0])}">${esc(tr(it.badge[1]))}</span>`:''}
      ${it.meta?`<span class="gm">${esc(tr(it.meta))}</span>`:''}</div>`).join('')}</div>${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
    case 'kanban':return `<div class="kb">${b.columns.map(col=>`<div class="kbcol"><div class="kh">${esc(tr(col.l))}<i>${col.items.length}</i></div>
      ${col.items.map(it=>`<div class="kbi"><b>${esc(tr(it.title))}</b>${it.sub?`<small>${esc(tr(it.sub))}</small>`:''}
        ${it.badge?`<span class="badge ${esc(it.badge[0])}">${esc(tr(it.badge[1]))}</span>`:''}</div>`).join('')}</div>`).join('')}</div>`;
    case 'form':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div><div class="gform">${b.fields.map(f=>{
        const ctl=f.type==='switch'?`<button class="sw" role="switch" aria-checked="${!!f.on}" aria-label="${esc(tr(f.l))}" onclick="swTog(this)"></button>`
          :f.type==='select'?`<button class="gsel" onclick="toast('${state.lang==='sk'?'Prepnuté (demo)':'Switched (demo)'}')">${esc(tr(f.v))} ${svg('chev',13)}</button>`
          :f.type==='textarea'?`<div class="gin ta">${esc(tr(f.v))}</div>`
          :`<div class="gin">${esc(tr(f.v))}</div>`;
        return `<div class="grow"${f.type==='textarea'?' style="grid-template-columns:1fr"':''}><div class="gfl"><b>${esc(tr(f.l))}</b>${f.s?`<small>${esc(tr(f.s))}</small>`:''}</div>${ctl}</div>`;
      }).join('')}</div>${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
    case 'timeline':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div>
      <div class="time">${b.items.map(t=>`<div class="ti"><div class="mk"></div><div class="tt">${esc(tr(t[1]))}<small>${esc(tr(t[0]))}</small></div></div>`).join('')}</div></div>`;
    case 'gallery':return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3></div>
      <div class="kpis" style="grid-template-columns:repeat(${Math.min(5,b.items.length)},1fr);margin-bottom:0">${b.items.map(c=>`<div class="kpi">
        <div class="l">${esc(tr(c.t))}</div><div class="v">${grp(c.n)}</div>${c.qa!==undefined?`<div class="d ${c.qa>=90?'up':'down'}">QA ${decs(c.qa)}${NBSP}%</div>`:''}</div>`).join('')}</div>
      ${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
    case 'graph':return graphBlock(b);
    case 'banner':return `<div class="banner ${esc(b.tone)}">${svg(b.tone==='no'?'warn':b.tone==='ok'?'check':'warn')}<span>${esc(tr(b.text))}</span></div>`;
    case 'note':return `<div class="hm-note" style="margin:0">${esc(tr(b.text))}</div>`;
    case 'code':return `<div class="codew"><div class="cbar"><b>${esc(tr(b.title))}</b><span class="lg">${esc(b.lang||'text')}</span>
      <button class="cp" onclick="toast('${state.lang==='sk'?'Skopírované (demo)':'Copied (demo)'}')">${state.lang==='sk'?'Kopírovať':'Copy'}</button></div><pre>${esc(b.text)}</pre></div>`;
    default:return '';
  }
}
function graphBlock(b){
  const K={core:L('jadro','core'),project:L('projekt','project'),skill:L('skill','skill'),memory:L('spomienka','memory')};
  /* držíme nody v ploche — pri x nad ~94 % by dlhý štítok vytiekol z karty */
  b.nodes.forEach(n=>{n.x=Math.max(7,Math.min(93,n.x));n.y=Math.max(8,Math.min(92,n.y));});
  const ed=(b.edges||[]).map(([a,c])=>{const A=b.nodes[a],B=b.nodes[c];if(!A||!B)return '';
    return `<line x1="${A.x}%" y1="${A.y}%" x2="${B.x}%" y2="${B.y}%" stroke="var(--line)" stroke-width="1"/>`;}).join('');
  const nd=b.nodes.map(n=>`<div class="gnode ${n.k==='core'?'core':''} ${(n.s||1)>=5?'big':''}" style="left:${n.x}%;top:${n.y}%">
    <i class="k-${n.k}"></i>${esc(tr(n.l))}${n.s?`<span style="font:500 9.5px var(--mono);color:var(--ink-3)">${n.s}</span>`:''}</div>`).join('');
  const lg=Object.entries(K).map(([k,l])=>`<div class="lr" style="gap:6px"><i class="k-${k}" style="width:9px;height:9px;border-radius:50%"></i><span>${esc(tr(l))}</span></div>`).join('');
  return `<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3><span class="sp">${b.nodes.length} ${state.lang==='sk'?'nodov':'nodes'} · ${(b.edges||[]).length} ${state.lang==='sk'?'spojení':'edges'}</span></div>
    <div class="gmap"><svg aria-hidden="true">${ed}</svg>${nd}</div>
    <div class="lgd" style="flex-direction:row;flex-wrap:wrap;gap:14px">${lg}</div>
    ${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}</div>`;
}

/* ── shell appky ───────────────────────────────────────────── */
function shell(a,skey,inner,crumbExtra){
  setAcc(a.acc);
  const nav=(a.screens||[]).map(s=>`<a onclick="go('#${a.key}/${s.key}')" class="${s.key===skey?'on':''}" ${s.key===skey?'aria-current="page"':''}>${svg(s.icon||'doc')}<span>${esc(tr(s.title))}</span></a>`).join('');
  const rail=APPS.map(x=>`<a onclick="go('#${x.key}${x.key==='chat'?'':'/'+screensOf(x)[0]}')" class="${x.key===a.key?'on':''}" style="--ac:${x.acc}" title="${esc(x.name)}" aria-label="${esc(x.name)}">${svg(x.icon)}</a>`).join('');
  const cur=(a.screens||[]).find(s=>s.key===skey);
  return `<div class="shell an">
    <aside class="side" id="side">
      <div class="mrail">${rail}</div>
      <div class="mname">${esc(a.name)}<small>:${a.port}</small></div>
      <nav class="nav" aria-label="${esc(a.name)}">${nav}</nav>
      <a class="hubl" onclick="go('#hub')">${svg('home',15)}<span>${state.lang==='sk'?'Späť na rozcestník':'Back to hub'}</span></a>
    </aside>
    <div class="drawer-scrim" onclick="closeDrawer()"></div>
    <main class="main">
      <div class="topb">
        <nav class="crumb" aria-label="breadcrumb"><a onclick="go('#hub')">Aura</a> ⁄ <a onclick="go('#${a.key}/${screensOf(a)[0]}')">${esc(a.name)}</a> ⁄ <b>${esc(tr(cur?cur.title:''))}${crumbExtra?' · '+esc(crumbExtra):''}</b></nav>
        <button class="search" onclick="openCmdk()" aria-label="${state.lang==='sk'?'Hľadať':'Search'}">${svg('search',15)}<span>${state.lang==='sk'?'Hľadať…':'Search…'}</span><span class="kbd">⌘K</span></button>
        <button class="icon-btn" onclick="go('#chat')" aria-label="AuraAI">${svg('chat')}</button>
        <button class="avatar" onclick="toast('${state.lang==='sk'?'Profil (demo)':'Profile (demo)'}')">SP</button>
      </div>
      <div class="content" id="content">${inner}</div>
    </main></div>`;
}
function renderScreen(a,s){
  const blocks=(s.blocks||[]).map(block).join('');
  const html=`<div class="phead"><h1>${esc(tr(s.title))}</h1><span class="sub">${esc(tr(s.sub||a.tag))}</span>
    <div class="actions"><button class="btn" onclick="toast('${state.lang==='sk'?'Export pripravený (demo)':'Export ready (demo)'}')">${svg('dl',14)} Export</button>
      <button class="btn pri" onclick="go('#chat')">${svg('chat',14)} ${state.lang==='sk'?'Spýtať sa AuraAI':'Ask AuraAI'}</button></div></div>
    <div class="blocks">${blocks}</div>`;
  view.innerHTML=shell(a,s.key,html);
}

/* ── chróm: toasty, ⌘K, drawer ─────────────────────────────── */
function toast(msg){
  const w=document.getElementById('toasts');const el=document.createElement('div');
  el.className='toast';el.setAttribute('role','status');el.innerHTML=`${svg('check',15)}<span>${esc(msg)}</span>`;
  w.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(6px)';setTimeout(()=>el.remove(),260);},2100);
}
function swTog(el){const on=el.getAttribute('aria-checked')==='true';el.setAttribute('aria-checked',String(!on));
  toast((state.lang==='sk'?'Prepnuté: ':'Toggled: ')+(on?(state.lang==='sk'?'vypnuté':'off'):(state.lang==='sk'?'zapnuté':'on')));}
function closeOverlay(){document.querySelectorAll('.scrim,.cmdk,.modal,.dropdown').forEach(e=>e.remove());state.overlay=null;}
function scrim(){const s=document.createElement('div');s.className='scrim';s.onclick=closeOverlay;document.body.appendChild(s);return s;}
function cmdkIndex(){
  const out=[{cc:'var(--b-chat)',ic:'chat',t:L('Nová konverzácia s AuraAI','New AuraAI conversation'),s:L('chat nad pamäťou a appkami','chat over the mind and the apps'),kind:'AI',go:'#chat'}];
  APPS.forEach(a=>{
    out.push({cc:a.acc,ic:a.icon,t:a.name,s:tr(a.tag),kind:L('Aplikácia','App'),go:'#'+a.key+(a.key==='chat'?'':'/'+screensOf(a)[0])});
    (a.screens||[]).forEach(s=>out.push({cc:a.acc,ic:s.icon||'doc',t:tr(s.title)+' — '+a.name,s:tr(s.sub||''),kind:L('Obrazovka','Screen'),go:`#${a.key}/${s.key}`}));
  });
  (CHAT.convos||[]).slice(0,6).forEach(c=>out.push({cc:'var(--b-chat)',ic:'chat',t:tr(c.title),s:tr(c.snippet||''),kind:L('Konverzácia','Chat'),go:'#chat/'+c.id}));
  return out;
}
function openCmdk(){
  closeOverlay();scrim();state.overlay='cmdk';
  const idx=cmdkIndex();const el=document.createElement('div');el.className='cmdk';
  el.innerHTML=`<div class="ci">${svg('search')}<input id="cmdkIn" placeholder="${state.lang==='sk'?'Hľadať appky, obrazovky, konverzácie…':'Search apps, screens, conversations…'}" aria-label="search"></div><div class="cres" id="cmdkRes"></div>`;
  document.body.appendChild(el);
  const draw=q=>{q=(q||'').toLowerCase().trim();
    const res=idx.filter(x=>!q||(tr(x.t)+' '+tr(x.s)).toLowerCase().includes(q)).slice(0,8);
    document.getElementById('cmdkRes').innerHTML=res.length
      ?res.map(x=>`<div class="cr" style="--cc:${x.cc}" onclick="closeOverlay();go('${x.go}')"><span class="ic">${svg(x.ic,16)}</span>
        <div class="ct"><b>${esc(tr(x.t))}</b><small>${esc(tr(x.s))}</small></div><span class="kind">${esc(tr(x.kind))}</span></div>`).join('')
      :`<div class="cempty">${state.lang==='sk'?'Nič sa nenašlo.':'Nothing found.'}</div>`;};
  draw('');const inp=document.getElementById('cmdkIn');inp.oninput=e=>draw(e.target.value);inp.focus();
}
function toggleDrawer(){document.body.classList.toggle('drawer');document.body.classList.toggle('csider');}
function closeDrawer(){document.body.classList.remove('drawer');document.body.classList.remove('csider');}

/* ── router ────────────────────────────────────────────────── */
function go(h){location.hash=h;}
function route(){
  closeOverlay();closeDrawer();
  const seg=(location.hash.replace(/^#/,'')||'hub').split('/');
  window.scrollTo(0,0);
  if(seg[0]==='chat')return renderChat(seg.slice(1));
  const a=appByKey(seg[0]);
  if(!a)return renderHub();
  const s=(a.screens||[]).find(x=>x.key===seg[1])||(a.screens||[])[0];
  if(!s)return renderHub();
  renderScreen(a,s);
}
window.addEventListener('hashchange',route);

/* jazyk a téma */
function applyStatic(){
  document.documentElement.lang=state.lang;
  document.title=state.lang==='sk'?'Aura AI · chat a zvyšné aplikácie':'Aura AI · chat and the remaining apps';
  const d=document.querySelector('.demo-tag');if(d)d.textContent=state.lang==='sk'?'Demo · ukážkové dáta':'Demo · sample data';
}
document.getElementById('langseg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;state.lang=b.dataset.lang;
  document.querySelectorAll('#langseg button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on));});
  applyStatic();route();
});
document.getElementById('themebtn').addEventListener('click',function(){
  state.theme=state.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=state.theme;
  this.setAttribute('aria-pressed',String(state.theme==='light'));
});
document.getElementById('hambBtn').addEventListener('click',toggleDrawer);
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if((e.metaKey||e.ctrlKey)&&(e.key||'').toLowerCase()==='k'){e.preventDefault();openCmdk();return;}
  if(e.key==='Escape'){if(state.overlay){closeOverlay();return;}if(state.art){state.art=null;route();return;}
    if(location.hash&&location.hash!=='#hub'){go('#hub');}return;}
  if(tag==='input'||tag==='textarea'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-6]$/.test(e.key)){const a=APPS[Number(e.key)-1];if(a)go('#'+a.key+(a.key==='chat'?'':'/'+screensOf(a)[0]));return;}
  const seg=(location.hash.replace(/^#/,'')||'hub').split('/');const a=appByKey(seg[0]);
  if(a&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    const ks=screensOf(a);const i=ks.indexOf(seg[1]);if(i<0)return;
    const n=e.key==='ArrowRight'?Math.min(ks.length-1,i+1):Math.max(0,i-1);go(`#${a.key}/${ks[n]}`);
  }
});

threads:{

    {r:'a',
     t:L('Team score je priemer šiestich zložiek podľa metodiky Aura KPI (plnenie oddelení, marža, dochádzka a tri ďalšie, cap 100 % na komponent). Presnú hodnotu za jún appka dopočíta až po uzávierke — ako ukážku uvádzam 78 % (ukážka), nie overené číslo.','Team score is the average of six components under the Aura KPI methodology (department attainment, margin, attendance and three more, each capped at 100%). The exact June figure is finalized only after close — as a sample I show 78% (sample), not a verified number.'),
     cite:[{k:'appka', l:'Aura KPI · /api/summary'}],
     tool:{name:'kpi_summary', args:L('department=all, month=2026-06','department=all, month=2026-06'), out:L('6 zložiek, cap 100 % na komponent, hodnota "78 %" je ukážková','6 components, 100% cap per component, "78%" value is a sample'), ms:340},
     art:null, acts:[{l:L('Otvoriť Aura KPI','Open Aura KPI'), k:'open'}], fb:true},
    {r:'u', t:L('A kde je najväčšia medzera medzi oddeleniami?','Where is the biggest gap between departments?'), cite:null, tool:null, art:null, acts:[], fb:false},
    {r:'a',
     t:L('Najväčší rozptyl je zvyčajne medzi Copywriter (váhy 60/20/20) a Newsletter-AI (nová -1M metodika s DPH a toleranciami) — obe majú odlišné vzorce, takže priame porovnanie percent je zavádzajúce. Konkrétne čísla za jún nemám potvrdené z appky, ukazujem len metodiku.','The widest spread is usually between Copywriter (60/20/20 weights) and Newsletter-AI (new -1M methodology with VAT and tolerances) — both use different formulas, so a direct percent comparison is misleading. I do not have June figures confirmed from the app, only the methodology.'),

    {r:'u', t:L('Založ koncept novej reklamácie pre zásielku #A4471, poškodený obal.','Draft a new claim for shipment #A4471, damaged packaging.'), cite:null, tool:null, art:null, acts:[], fb:false},

     cite:[{k:'ukážka', l:L('ukážka · koncept','sample · draft')}], tool:null, art:null,
     acts:[{l:L('Založiť reklamáciu','Create claim'), k:'create'}], fb:true},
    {r:'u', t:L('Vieš to rovno odoslať bez môjho potvrdenia?','Can you send it right away without my confirmation?'), cite:null, tool:null, art:null, acts:[], fb:false},
    {r:'a',
     t:L('Nie — akcie ako založenie reklamácie sa vždy len pripravia ako koncept a čakajú na tvoje kliknutie Potvrdiť. Automatický zápis bez schválenia AuraAI nerobí.','No — actions like creating a claim are always prepared as a draft and wait for you to click Confirm. AuraAI never writes automatically without approval.'),

const CHAT=(typeof W2_CHAT!=='undefined')?W2_CHAT:{convos:[],threads:{},projects:[],prompts:[],models:[],states:[],files:[],settings:[],sugg:[],usage:{today:{},rows:[]},meta:{}};

const CTONE=t=>t==='ok'?'ok':t==='no'?'no':'cond';
const convoById=id=>(CHAT.convos||[]).find(c=>c.id===id);
function threadOf(id){
  if(CHAT.threads&&CHAT.threads[id])return CHAT.threads[id];

  return [{r:'u',t:c.title},{r:'a',t:c.snippet,fb:true,
