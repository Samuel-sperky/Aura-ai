<!doctype html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura · Ekosystém aplikácií</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --teal:#05bcc4; --teal-2:#03797e; --teal-3:#7fd0d4;
  --gold:#d8b878; --gold-t:#c9a869;
  --paper:#0e1413; --card:#131b1a; --card-2:#1b2523; --line:#22302e;
  --ink:#e8f0ef; --ink-2:#b9c9c7; --ink-3:#829896;
  --good:#3fbf7f; --amber:#e8a33d; --red:#e0554e; --violet:#8b7fd4;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Playfair Display',Georgia,serif;
  --body:'Inter',system-ui,sans-serif;
  --acc:var(--teal);
  --r:14px;
}
:root[data-theme="light"]{
  --paper:#f8f4f7; --card:#fffdfe; --card-2:#ece6ea; --line:#e2dae0;
  --ink:#131b1a; --ink-2:#3b4a48; --ink-3:#667574; --gold-t:#8a6417;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}

/* ── global control bar ─────────────────────────────────────── */
.gbar{
  position:fixed; top:0; left:0; right:0; height:52px; z-index:50;
  display:flex; align-items:center; gap:14px; padding:0 18px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:700;letter-spacing:.2px}
.crown{width:20px;height:20px;color:var(--gold)}
.brand .w{font-family:var(--disp);font-size:18px}
.brand .w b{color:var(--teal)}
.demo-tag{
  font:600 10px/1 var(--mono); letter-spacing:.14em; color:var(--amber);
  border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));
  padding:5px 8px; border-radius:20px; text-transform:uppercase;
  background:color-mix(in srgb,var(--amber) 10%,transparent);
}
.gspace{flex:1}
.ctl{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{
  font:600 12px var(--body); color:var(--ink-3); background:transparent;
  border:0; padding:7px 11px; cursor:pointer; letter-spacing:.02em;
}
.seg button.on{color:var(--paper);background:var(--acc)}
:root[data-theme="light"] .seg button.on{color:#fff}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); cursor:pointer;
  display:grid;place-items:center;
}
.icon-btn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.icon-btn svg{width:17px;height:17px}

.view{padding-top:52px;min-height:100vh}

/* ── HUB landing ────────────────────────────────────────────── */
.hub{max-width:1120px;margin:0 auto;padding:56px 26px 80px}
.hub .eb{font:600 12px var(--mono);letter-spacing:.2em;color:var(--teal);text-transform:uppercase}
.hub h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,5vw,54px);line-height:1.05;margin:16px 0 10px;letter-spacing:-.5px}
.hub h1 em{color:var(--teal);font-style:normal}
.hub .lead{color:var(--ink-2);font-size:18px;max-width:620px;margin:0 0 12px}
.hub .note{color:var(--ink-3);font-size:13.5px;max-width:640px;margin:0 0 40px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid6{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid6{grid-template-columns:1fr}}
.mcard{
  position:relative; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:22px 20px 20px; cursor:pointer; overflow:hidden;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
.mcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 55%,var(--line));box-shadow:0 14px 34px -20px var(--ac)}
.mcard .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);margin-bottom:14px}
.mcard .ico svg{width:22px;height:22px}
.mcard .num{position:absolute;top:18px;right:18px;font:600 12px var(--mono);color:var(--ink-3)}
.mcard h3{font-family:var(--disp);font-weight:700;font-size:21px;margin:0 0 6px}
.mcard p{color:var(--ink-2);font-size:13.5px;margin:0 0 14px;min-height:40px}
.mcard .meta{display:flex;align-items:center;gap:8px;color:var(--ink-3);font:600 11.5px var(--mono);letter-spacing:.04em}
.mcard .go{margin-left:auto;color:var(--ac);display:inline-flex;align-items:center;gap:4px}

/* ── module INTRO cover ─────────────────────────────────────── */
.intro{min-height:calc(100vh - 52px);display:grid;place-items:center;padding:40px 26px;position:relative;overflow:hidden}
.intro .glow{position:absolute;inset:0;background:radial-gradient(60% 60% at 22% 18%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);pointer-events:none}
.intro-in{max-width:960px;width:100%;position:relative;display:grid;grid-template-columns:1.3fr .9fr;gap:44px;align-items:center}
@media(max-width:820px){.intro-in{grid-template-columns:1fr}}
.intro .eb{font:600 12px var(--mono);letter-spacing:.2em;color:var(--acc);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.intro .eb .n{color:var(--ink-3)}
.intro h1{font-family:var(--disp);font-weight:800;font-size:clamp(32px,5.4vw,52px);line-height:1.04;margin:18px 0 14px;letter-spacing:-.5px}
.intro .tag{color:var(--ink-2);font-size:18px;margin:0 0 24px;max-width:460px}
.feat{list-style:none;padding:0;margin:0 0 30px;display:grid;gap:12px}
.feat li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-2);font-size:14.5px}
.feat .dot{margin-top:6px;width:8px;height:8px;border-radius:3px;background:var(--acc);flex:none}
.cta{display:inline-flex;align-items:center;gap:9px;background:var(--acc);color:var(--paper);font-weight:600;font-size:14px;padding:12px 20px;border-radius:11px;border:0;cursor:pointer}
:root[data-theme="light"] .cta{color:#fff}
.intro-art{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 30px 60px -40px #000}
.intro-art .mini-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.intro-art .mini-h .d{width:9px;height:9px;border-radius:50%}
.intro-art .mini-h .d:nth-child(1){background:var(--red)}
.intro-art .mini-h .d:nth-child(2){background:var(--amber)}
.intro-art .mini-h .d:nth-child(3){background:var(--good)}

/* ── APP shell (dashboard/list/detail/settings) ────────────── */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
@media(max-width:780px){.shell{grid-template-columns:64px 1fr}}
.side{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;padding:16px 12px;gap:16px}
.mrail{display:flex;gap:6px;flex-wrap:wrap}
.mrail a{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);border:1px solid transparent}
.mrail a svg{width:17px;height:17px}
.mrail a.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:color-mix(in srgb,var(--ac) 40%,var(--line))}
.mrail a:hover{color:var(--ink)}
.side .mname{font-family:var(--disp);font-weight:700;font-size:16px;padding:0 6px}
.side .mname small{display:block;font-family:var(--mono);font-weight:500;font-size:10px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:500}
.nav a svg{width:17px;height:17px;color:var(--ink-3)}
.nav a.on{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--ink)}
.nav a.on svg{color:var(--acc)}
.nav a:hover:not(.on){background:var(--card-2)}
@media(max-width:780px){.side .mname,.nav a span,.side .hubl span{display:none}.nav a{justify-content:center;padding:9px}}
.side .hubl{margin-top:auto;display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:12.5px;padding:8px 11px;border-top:1px solid var(--line)}
.side .hubl svg{width:15px;height:15px}

.main{min-width:0;display:flex;flex-direction:column}
.topb{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line)}
.crumb{font:500 12.5px var(--mono);color:var(--ink-3);letter-spacing:.03em}
.crumb b{color:var(--ink)}
.topb .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink-3);font-size:13px;min-width:180px}
.topb .search svg{width:15px;height:15px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--teal-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.content{padding:24px;overflow:auto}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.phead h2{font-family:var(--disp);font-weight:700;font-size:24px;margin:0}
.phead .sub{color:var(--ink-3);font-size:13px}
.phead .actions{margin-left:auto;display:flex;gap:9px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);font:600 12.5px var(--body);padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--acc);color:var(--paper);border-color:var(--acc)}
:root[data-theme="light"] .btn.pri{color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.kpi .l{color:var(--ink-3);font-size:12px;font-weight:500;margin-bottom:9px}
.kpi .v{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1}
.kpi .d{margin-top:9px;font:600 11.5px var(--mono);display:inline-flex;align-items:center;gap:4px}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--red)} .kpi .d.flat{color:var(--ink-3)}

.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card .ch h3{font-size:14px;font-weight:600;margin:0}
.card .ch .sp{margin-left:auto;font:600 11px var(--mono);color:var(--ink-3)}

/* bar chart */
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:8px}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
.bars .bar .col{width:100%;max-width:38px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 45%,var(--card)));min-height:4px}
.bars .bar .bl{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.2}
.bars .bar .bv{font:600 11px var(--mono);color:var(--ink-2)}

/* area chart */
.area{width:100%;height:150px;display:block}

/* donut */
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:104px;height:104px;flex:none}
.donut .dl{font-size:12.5px;color:var(--ink-2)}
.donut .dl b{display:block;font-family:var(--disp);font-size:22px;color:var(--ink);margin-bottom:2px}

/* list of small rows */
.rows{display:flex;flex-direction:column}
.rows .rw{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:13px}
.rows .rw:first-child{border-top:0}
.rows .rw .t{flex:1;min-width:0}
.rows .rw .t b{display:block;font-weight:600}
.rows .rw .t small{color:var(--ink-3)}
.rows .rw .val{font:600 12.5px var(--mono);color:var(--ink-2)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{text-align:left;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 14px;border-bottom:1px solid var(--line)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink-2)}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:var(--card-2)}
table.t td b{color:var(--ink);font-weight:600}
.num{text-align:right;font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--body);padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.badge.cond{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.badge.no{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.badge.q{color:var(--ink-3);background:color-mix(in srgb,var(--ink-3) 16%,transparent)}
.badge.info{color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent)}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font:600 12px var(--body);padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);cursor:pointer}
.chip.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,transparent)}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:14px;color:var(--ink-3);font:600 12px var(--mono)}
.pager span{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
.pager span.on{color:var(--acc);border-color:var(--acc)}

/* detail */
.dcols{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media(max-width:900px){.dcols{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
.field{padding:11px 0;border-bottom:1px solid var(--line)}
.field .fl{color:var(--ink-3);font-size:11.5px;margin-bottom:3px}
.field .fv{font-size:14px;font-weight:500}
.time{display:flex;flex-direction:column;gap:0}
.time .ti{display:flex;gap:13px;padding:10px 0}
.time .ti .mk{position:relative;flex:none;width:12px}
.time .ti .mk::before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.time .ti .mk::after{content:"";position:absolute;left:6px;top:13px;bottom:-10px;width:1px;background:var(--line)}
.time .ti:last-child .mk::after{display:none}
.time .ti .tt{font-size:13px}
.time .ti .tt small{display:block;color:var(--ink-3);font:500 11px var(--mono);margin-top:2px}

/* settings */
.set-group{margin-bottom:16px}
.set-group>.gh{font-size:13.5px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.set-group>.gh svg{width:16px;height:16px;color:var(--acc)}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .sl{flex:1}
.set-row .sl b{display:block;font-size:13.5px;font-weight:500}
.set-row .sl small{color:var(--ink-3);font-size:12px}
.sw{width:42px;height:24px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:.16s}
.sw.on{background:color-mix(in srgb,var(--acc) 30%,transparent);border-color:var(--acc)}
.sw.on::after{left:20px;background:var(--acc)}
.selbox{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;font:500 13px var(--body);color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.selbox svg{width:14px;height:14px;color:var(--ink-3)}
.inp{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font:500 13px var(--body);color:var(--ink);min-width:160px}

.an{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{.gbar{display:none}.view{padding-top:0}}
</style>
</head>
<body>
<div class="gbar">
  <div class="brand" onclick="location.hash='#hub'">
    <svg class="crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8l4 4 5-7 5 7 4-4-2 12H5L3 8z"/></svg>
    <span class="w"><b>Aura</b> <span data-i="suite">Suite</span></span>
  </div>
  <span class="demo-tag" data-i="demo">Demo · ukážkové dáta</span>
  <div class="gspace"></div>
  <div class="ctl">
    <div class="seg" id="langseg">
      <button data-lang="sk" class="on">SK</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="themebtn" title="Téma">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</div>
<div class="view" id="view"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Aura Suite — náhľad ekosystému aplikácií (self-contained)
   Bez CDN skriptov, bez localStorage, bez analytiky. Grafy sú SVG/CSS.
   Všetky dáta sú DEMO a slúžia len na ukážku obrazoviek.
   ══════════════════════════════════════════════════════════════ */
const L=(sk,en)=>({sk,en});
const state={lang:'sk',theme:'dark'};
const tr=o=>o&&typeof o==='object'&&'sk'in o?o[state.lang]:o;

/* ── ikony ─────────────────────────────────────────────────── */
const I={
  megaphone:'<path d="M3 11v2a1 1 0 001 1h1l3 4V6L5 10H4a1 1 0 00-1 1z"/><path d="M8 6l9-3v14l-9-3"/><path d="M17 8a3 3 0 010 6"/>',
  people:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><path d="M16 6a3 3 0 010 6"/><path d="M15 20a6 6 0 013-5"/>',
  trend:'<path d="M4 18l6-6 3 3 7-7"/><path d="M17 8h4v4"/>',
  coins:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  lifebuoy:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5 5l4 4M15 15l4 4M19 5l-4 4M9 15l-4 4"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

const svg=(p,w=18)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ── grafové pomôcky ───────────────────────────────────────── */
function bars(items){
  const max=Math.max(...items.map(i=>i.v));
  return `<div class="bars">${items.map(i=>`
    <div class="bar"><span class="bv">${i.d??i.v}</span>
      <div class="col" style="height:${Math.max(6,i.v/max*100)}%"></div>
      <span class="bl">${tr(i.l)}</span></div>`).join('')}</div>`;
}
function area(vals){
  const max=Math.max(...vals),min=Math.min(...vals),w=560,h=150,pad=6;
  const rng=(max-min)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1), h-8-((v-min)/rng)*(h-24)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const fill=line+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  return `<svg class="area" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--acc)" stop-opacity=".35"/>
      <stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    <path d="${fill}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--acc)"/>`).join('')}
  </svg>`;
}
function donut(pct,label){
  const r=42,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="donut">
    <svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--acc)" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 52 52)"/>
    <text x="52" y="57" text-anchor="middle" font-family="var(--disp)" font-size="21" font-weight="700" fill="var(--ink)">${pct}%</text></svg>
    <div class="dl">${label}</div></div>`;
}

}

function route(){
  const h=location.hash.replace(/^#/,'')||'hub';
  const [key,screen]=h.split('/');
  if(key==='hub'||!MOD[key]){renderHub();window.scrollTo(0,0);return;}
  const m=MOD[key];
  if(!screen){renderIntro(m);window.scrollTo(0,0);return;}
  ({dashboard:renderDashboard,list:renderList,detail:renderDetail,settings:renderSettings}[screen]||renderIntro)(m);
  document.querySelector('.content')?.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* i18n statické popisky + prepínače */
function applyStatic(){
  document.querySelectorAll('[data-i]').forEach(el=>{
    const k=el.getAttribute('data-i');
    const dict={suite:{sk:'Suite',en:'Suite'},demo:{sk:'Demo · ukážkové dáta',en:'Demo · sample data'}};
    if(dict[k])el.textContent=dict[k][state.lang];
  });
  document.documentElement.lang=state.lang;
}
document.getElementById('langseg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state.lang=b.dataset.lang;
  document.querySelectorAll('#langseg button').forEach(x=>x.classList.toggle('on',x===b));
  applyStatic();route();
});
document.getElementById('themebtn').addEventListener('click',()=>{
  state.theme=state.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=state.theme;
});

window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){location.hash='#hub';return;}
  if(/^[1-6]$/.test(e.key)){location.hash='#'+MODULES[+e.key-1].key;return;}
  const [key,screen]=(location.hash.replace(/^#/,'')||'hub').split('/');
  if(!MOD[key]||!screen)return;
  const i=SCREENS.indexOf(screen);
  if(e.key==='ArrowRight'&&i<SCREENS.length-1)location.hash=`#${key}/${SCREENS[i+1]}`;
  if(e.key==='ArrowLeft'){ if(i>0)location.hash=`#${key}/${SCREENS[i-1]}`; else location.hash='#'+key; }
});

applyStatic();route();
</script>
