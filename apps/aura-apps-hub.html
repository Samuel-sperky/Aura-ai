/* ── render ─────────────────────────────────────────────────── */
function aiRenderHead(){
  const el=document.getElementById('aiCtxLine');if(!el)return;
  const ctx=aiCtx();
  if(!ctx.onModule){el.textContent='Aura Suite';return;}
  let t=(state.lang==='sk'?'vidí: ':'sees: ')+ctx.m.name.replace('Aura ','')+' / '+aiScreenName(ctx.m,ctx.screen);
  const ci=state.filter[ctx.m.key]||0;
  if(ci>0)t+=' · filter: '+tr(chipsFor(ctx.m)[ci].l);
  el.textContent=t;
}
function aiRenderSugg(){
  const el=document.getElementById('aiSugg');if(!el)return;
  const ctx=aiCtx();const set=ctx.key?AI[ctx.key]:null;
  el.innerHTML=set?set.q.map((it,j)=>'<button class="ai-chip" data-ai-s="'+j+'">'+esc(tr(it.q))+'</button>').join(''):'';
  el.querySelectorAll('[data-ai-s]').forEach(b=>{b.addEventListener('click',()=>aiAsk(set.q[+b.dataset.aiS]));});
}
function aiRenderMsgs(){
  const body=document.getElementById('aiBody');if(!body)return;
  const H=state.chat.history;let h='';
  if(!H.length&&!aiTypingFlag)
    h+='<div class="ai-msg ai-a">'+esc(tr(L('Ahoj! Som AuraAI. Vidím dáta aktuálnej stránky — vyber si navrhovanú otázku alebo napíš vlastnú.','Hi! I am AuraAI. I can see the current page data — pick a suggested question or type your own.')))+'</div>';
  H.forEach((e,i)=>{
    if(e.r==='u'){
      h+='<div class="ai-msg ai-u"><span class="ai-tag">'+esc(e.tag||'')+'</span>'+esc(tr(e.t))+'</div>';
    }else{
      let inner=esc(tr(e.t));
      if(e.fallback){
        const set=AI[e.tag];
        if(set)inner+='<div class="ai-fbchips">'+set.q.map((it,j)=>'<button class="ai-chip" data-ai-fb="'+esc(e.tag)+'|'+j+'">'+esc(tr(it.q))+'</button>').join('')+'</div>';
      }
      if(e.act)inner+='<br><button class="ai-act" data-ai-run="'+i+'">'+svg(AI_ACT_I[e.act.type]||I.arrow,13)+' '+esc(tr(AI_ACT_L[e.act.type]||L('Akcia','Action')))+'</button>';
      inner+=aiCiteHTML(e.cite||'demo',e.tag);
      h+='<div class="ai-msg ai-a">'+inner+'</div>';
    }
  });
  if(aiTypingFlag)h+='<div class="ai-typing" id="aiTyping"><div class="sk"></div><div class="sk"></div></div>';
  body.innerHTML=h;
  body.querySelectorAll('[data-ai-run]').forEach(b=>{b.addEventListener('click',()=>aiRunAct(+b.dataset.aiRun));});
  body.querySelectorAll('[data-ai-fb]').forEach(b=>{b.addEventListener('click',()=>{
    const p=b.dataset.aiFb.split('|');const set=AI[p[0]];
    if(set&&set.q[+p[1]])aiAsk(set.q[+p[1]]);});});
  body.scrollTop=body.scrollHeight;
}

/* ── konverzácia ────────────────────────────────────────────── */
function aiAsk(item,userText){
  if(aiTypingFlag)return;
  const ctx=aiCtx();const tag=ctx.key||'hub';
  state.chat.history.push({r:'u',t:userText||item.q,tag});
  aiTypingFlag=true;aiRenderMsgs();
  setTimeout(()=>{
    aiTypingFlag=false;
    state.chat.history.push({r:'a',t:item.a,cite:item.cite,act:item.act,tag});
    aiRenderMsgs();
  },600+Math.floor(Math.random()*300));
}
function aiFallback(text){
  if(aiTypingFlag)return;
  const ctx=aiCtx();const tag=ctx.key||'hub';
  state.chat.history.push({r:'u',t:text,tag});
  aiTypingFlag=true;aiRenderMsgs();
  setTimeout(()=>{
    aiTypingFlag=false;
    state.chat.history.push({r:'a',t:L('V demoverzii poznám tieto otázky:','In this demo I know these questions:'),fallback:true,cite:'demo',tag});
    aiRenderMsgs();
  },600+Math.floor(Math.random()*300));
}
/* voľný vstup: lowercase + bez diakritiky → keyword match (aktuálna stránka má bonus) */
function aiMatch(text){
  const n=aiNorm(text);if(!n)return null;
  const ctx=aiCtx();let best=null,bs=0;
  const scan=(key,bonus)=>{
    const set=AI[key];if(!set)return;
    set.q.forEach(it=>{
      let s=0;(it.kw||[]).forEach(k=>{if(n.includes(k))s++;});
      if(s>0)s+=bonus;
      if(s>bs){bs=s;best=it;}
    });
  };
  if(ctx.key)scan(ctx.key,0.5);
  Object.keys(AI).forEach(k=>{if(k!==ctx.key)scan(k,0);});
  return best;
}
function aiSend(){
  const inp=document.getElementById('aiIn');
  const v=(inp.value||'').trim();if(!v||aiTypingFlag)return;
  inp.value='';
  const m=aiMatch(v);
  if(m)aiAsk(m,v);else aiFallback(v);
}
/* max 1 akcia na odpoveď */
function aiRunAct(i){
  const e=state.chat.history[i];if(!e||!e.act)return;
  const act=e.act;
  if(act.type==='goto'){
    if(window.innerWidth<821)aiClose();
    if(location.hash===act.arg)route();else go(act.arg);
  }else if(act.type==='filter'){
    const k=act.arg.h.split('/')[0].slice(1);
    state.filter[k]=act.arg.chip;
    if(window.innerWidth<821)aiClose();
    if(location.hash===act.arg.h)route();else go(act.arg.h);
  }else if(act.type==='export'){
    toast(tr(L('CSV export pripravený (demo)','CSV export ready (demo)')));
  }else if(act.type==='create'){
    const mk=(e.tag||'').split('/')[0];
    if(!mk||!MOD[mk])return;
    const kk=mk+'/active';
    (state.steps[kk]=state.steps[kk]||[]).unshift('AuraAI: '+tr(act.arg));
    toast(tr(L('Krok zapísaný do aktivity detailu','Step logged into the detail activity')));
    const seg=location.hash.replace(/^#/,'').split('/');
    if(seg[0]==='#'+mk||seg[0]===mk){if(seg[1]==='detail'&&!seg[2])renderDetail(MOD[mk],undefined);}
  }
}

/* ── otvor / zavri / synchronizuj ───────────────────────────── */
function aiOpen(){
  if(!aiCtx().onModule){toast(tr(L('AuraAI je dostupný na stránkach modulov','AuraAI is available on module pages')));return;}
  state.chat.open=true;aiSyncNow();
  const inp=document.getElementById('aiIn');if(inp&&window.innerWidth>820)inp.focus();
}
function aiClose(){state.chat.open=false;aiSyncNow();}
function aiToggle(){state.chat.open?aiClose():aiOpen();}
function aiSyncNow(){
  const ctx=aiCtx();
  const on=ctx.onModule;
  const open=on&&state.chat.open;
  aiFab.style.display=(on&&!state.chat.open)?'grid':'none';
  aiFab.title='AuraAI (⌘J)';
  aiFab.setAttribute('aria-label',tr(L('Otvoriť AuraAI chat','Open the AuraAI chat')));
  document.body.classList.toggle('ai-fab-on',on&&!state.chat.open);
  document.body.classList.toggle('ai-open',open);
  if(open){
    aiRenderHead();aiRenderSugg();aiRenderMsgs();
    const inp=document.getElementById('aiIn');
    if(inp)inp.placeholder=tr(L('Napíš otázku…','Type a question…'));
  }
}

/* POST hook — po každom prekreslení routera (aj po zmene jazyka) */
POST.push(function(){aiSyncNow();});

/* ── ⌘J skratka + Escape (capture, aby nezasiahol globálny listener) ── */
window.addEventListener('keydown',function(e){
  const k=(e.key||'').toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='j'){e.preventDefault();e.stopPropagation();aiToggle();return;}
  if(k==='escape'&&state.chat&&state.chat.open){
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea')return; /* nech existujúci guard spraví blur */
    if(state.overlay)return;                   /* najprv nech sa zavrie overlay */
    e.stopPropagation();aiClose();
  }
},true);

/* ── ⌘K položka: dokumentovaný wrap cmdkIndex ───────────────── */
/* openCmdk volá globálnu cmdkIndex(); prepíšeme window binding wrapperom,
   ktorý pridá riadok „Spýtať sa AuraAI…" na začiatok indexu.
   Šablóna riadku robí go('<go>') — aiFromCmdk() vráti aktuálny hash
   (žiadna navigácia) a asynchrónne otvorí panel. */
window.aiFromCmdk=function(){setTimeout(aiOpen,0);return location.hash||'#hub';};
const _cmdkIndex=window.cmdkIndex;
window.cmdkIndex=function(){
  const out=_cmdkIndex();
  out.unshift({cc:'var(--gold)',ic:AI_CROWN,
    t:L('Spýtať sa AuraAI…','Ask AuraAI…'),
    s:L('Chat nad dátami modulov · ⌘J','Chat over module data · ⌘J'),
    kind:'AI',go:"'+window.aiFromCmdk()+'"});
  return out;
};

/* init — prvý route už prebehol pred načítaním tohto súboru */
aiSyncNow();

window.AI3={AI,open:aiOpen,close:aiClose,toggle:aiToggle,ask:aiAsk};
})();

</script>
