.hubgrp{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 12px}

/* tlač: skryť chróm, ktorý do reportu nepatrí */
@media print{.cn-pill,.ai-panel,.side,.topb .search,.topb .icon-btn,.topb .avatar,.hamb2{display:none!important}

const svg=(p,w=18)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[p]||p}</svg>`;

/* ── grafy ─────────────────────────────────────────────────── */
function bars(data){
  const max=Math.max(...data.map(d=>d.v||0),1);
  const grid=[75,50,25].map(p=>`<i style="top:${100-p}%"><b>${decs(Math.round(max*p/100*10)/10)}</b></i>`).join('');
  return `<div class="chartw"><div class="grid">${grid}</div><div class="bars">${data.map((d,i)=>`<div class="bar${d.v===max?' mx':''}">
    <span class="bv">${grp(d.v)}</span><div class="col" style="height:${Math.max(5,d.v/max*100)}%;--i:${i}"></div>
    <span class="bl">${esc(tr(d.l))}</span></div>`).join('')}</div></div>`;
}
function lines(pg){
  const W=560,H=170,pad=8,n=(pg.labels||[]).length;
  const all=pg.series.flatMap(s=>s.v),mx=Math.max(...all),mn=Math.min(...all),rng=(mx-mn)||1;
  const X=i=>pad+i*(W-2*pad)/Math.max(1,n-1), Y=v=>H-18-((v-mn)/rng)*(H-40);
  const path=vs=>vs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const mavg=vs=>vs.map((_,i)=>{const a=vs.slice(Math.max(0,i-2),i+1);return a.reduce((s,x)=>s+x,0)/a.length;});
  const p=pg.series.map(s=>`<path d="${path(s.v)}" fill="none" stroke="${s.color||'var(--acc)'}" stroke-width="2" stroke-linejoin="round"/>`).join('');
  const av=pg.avg?`<path d="${path(mavg(pg.series[0].v))}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="5 4"/>`:'';
  const lb=(pg.labels||[]).map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">${esc(tr(l))}</text>`).join('');
  const lg=`<div class="lgd" style="flex-direction:row;flex-wrap:wrap;gap:14px">${pg.series.map(s=>`<div class="lr" style="gap:6px"><i style="background:${s.color||'var(--acc)'}"></i><span>${esc(tr(s.l))}</span></div>`).join('')}${pg.avg?`<div class="lr" style="gap:6px"><i style="background:var(--ink-3)"></i><span>${state.lang==='sk'?'kĺzavý priemer':'moving average'}</span></div>`:''}</div>`;
  return `<svg class="area" style="height:${H}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${p}${av}${lb}</svg>${lg}`;
}
function stackChart(b){
  const totals=b.labels.map((_,i)=>b.series.reduce((s,sr)=>s+(sr.v[i]||0),0));const mx=Math.max(...totals,1);

}
function donut(v,label){

    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round"

    const tok=v>=100?'var(--good)':v>=60?'var(--amber)':'var(--red)';
    return `<div class="cell" style="background:color-mix(in srgb,${tok} ${v>=100?42:v>=60?30:26}%,var(--card-2))" title="${decs(v)} %">${decs(v)}</div>`;};
  const cols=b.cols.length;
  return `<div class="hm" style="--hc:${cols}"><div class="hrow" style="grid-template-columns:118px repeat(${cols},1fr)"><span></span>${b.cols.map(c=>`<span class="mh">${esc(tr(c))}</span>`).join('')}</div>
    ${b.rows.map(r=>`<div class="hrow" style="grid-template-columns:118px repeat(${cols},1fr)"><span class="hl">${esc(tr(r.l))}</span>${r.v.map(cell).join('')}</div>`).join('')}</div>`;
}
function gantt(b){
  const today=b.today!=null?`<div style="position:absolute;left:calc(64px + (100% - 172px)*${b.today/100});top:-6px;bottom:-6px;width:1px;background:var(--gold);opacity:.7"></div>`:'';
  return `<div class="gantt" style="position:relative">${today}
    ${b.rows.map(r=>`<div class="grow"><span class="gl">${esc(tr(r.l))}</span>
      <div class="gtrack"><div class="gfill" style="margin-left:${r.s||0}%;width:${r.w||10}%"></div></div>
      <span class="gst">${r.b?`<span class="badge ${esc(r.b[0])} mono" style="font-size:10px">${esc(tr(r.b[1]))}</span>`:''}</span></div>`).join('')}</div>`;
}

  const ST=[L('chýba','missing'),L('koncept','draft'),L('hotový','done')];

  const body=b.rows.map((r,ri)=>{const key=typeof r==='string'?r:(r.k||tr(r));const st=b.st[key]||[];

        return `<span class="mfc s${v}" title="${esc(tr(ST[v]))}">${v===2?'✓':v===1?'~':'—'}</span>`;}).join('')}</div>`;}).join('');
  return `<div class="mfx">${head}${body}</div>

}
function graphBlock(b){
  const K={core:L('jadro','core'),project:L('projekt','project'),skill:L('skill','skill'),memory:L('spomienka','memory')};
  b.nodes.forEach(n=>{n.x=Math.max(7,Math.min(93,n.x));n.y=Math.max(8,Math.min(92,n.y));});
  const ed=(b.edges||[]).map(([a,c])=>{const A=b.nodes[a],B=b.nodes[c];if(!A||!B)return '';
    return `<line x1="${A.x}%" y1="${A.y}%" x2="${B.x}%" y2="${B.y}%" stroke="var(--line)" stroke-width="1"/>`;}).join('');
  const nd=b.nodes.map(n=>`<div class="gnode ${n.k==='core'?'core':''} ${(n.s||1)>=5?'big':''}" style="left:${n.x}%;top:${n.y}%">
    <i class="k-${n.k}"></i>${esc(tr(n.l))}${n.s?`<span style="font:500 9.5px var(--mono);color:var(--ink-3)">${n.s}</span>`:''}</div>`).join('');
  return `<div class="gmap"><svg aria-hidden="true">${ed}</svg>${nd}</div>
    <div class="lgd" style="flex-direction:row;flex-wrap:wrap;gap:14px">${Object.entries(K).map(([k,l])=>`<div class="lr" style="gap:6px"><i class="k-${k}" style="width:9px;height:9px;border-radius:50%"></i><span>${esc(tr(l))}</span></div>`).join('')}</div>`;
}

/* ── tabuľka s triedením a stránkovaním ────────────────────── */
const PAGE=12;
function cellTxt(c){if(c&&c.pln!==undefined)return String(c.pln);if(Array.isArray(c))return tr(c[1]);return String(fmtCell(c));}
function cellHTML(c,i){
  if(c&&c.pln!==undefined){const v=c.pln,tok=v>=100?'var(--good)':v>=60?'var(--amber)':'var(--red)';
    return `<td><span class="plnw"><span class="plnbar"><i style="width:${Math.min(v,100)}%;background:${tok}"></i></span>
      <span class="n" style="font-family:var(--mono)">${decs(v)}${NBSP}%</span></span></td>`;}
  if(Array.isArray(c))return `<td><span class="badge ${esc(c[0])}">${esc(tr(c[1]))}</span></td>`;
  if(typeof c==='string'&&/^[↑↓→—]$/.test(c)){const cl=c==='↑'?'tr-up':c==='↓'?'tr-dn':'tr-fl';return `<td class="${cl}" style="font-size:15px">${c}</td>`;}
  const s=fmtCell(c);
  const num=isNum(c)||(typeof s==='string'&&/^[~≈−+€—-]?[\d\s.,:%€/hms -]+$/.test(s)&&/\d/.test(s));
  return `<td class="${num?'n':''}">${i===0?`<b>${esc(s)}</b>`:esc(s)}</td>`;
}
function tableBlock(b,bi){
  const id=(CURSCR||'')+'-'+bi;
  const rows0=(state.extra[id]||[]).concat(b.rows);
  const so=state.sort[id];
  let rows=rows0.slice();
  if(so){const{i,dir}=so;rows.sort((a,x)=>{const A=cellTxt(a.c[i]),X=cellTxt(x.c[i]);
    const na=parseFloat(String(A).replace(/[^\d.,-]/g,'').replace(/\s/g,'').replace(',','.'));
    const nx=parseFloat(String(X).replace(/[^\d.,-]/g,'').replace(/\s/g,'').replace(',','.'));
    const r=(!isNaN(na)&&!isNaN(nx))?na-nx:String(A).localeCompare(String(X),'sk');
    return dir==='asc'?r:-r;});}
  const paged=b.page!==false&&rows.length>PAGE;
  const pg=Math.min(state.page[id]||0,paged?Math.ceil(rows.length/PAGE)-1:0);
  const view=paged?rows.slice(pg*PAGE,(pg+1)*PAGE):rows;
  const th=b.cols.map((c,i)=>{const a=so&&so.i===i?(so.dir==='asc'?'ascending':'descending'):'none';
    return `<th scope="col" aria-sort="${a}" onclick="sortBy('${id}',${i})" style="cursor:pointer">${esc(tr(c))}${so&&so.i===i?(so.dir==='asc'?' ↑':' ↓'):''}</th>`;}).join('');
  const pager=paged?`<div class="pgr"><span>${state.lang==='sk'?'Riadky':'Rows'} ${pg*PAGE+1}–${Math.min(rows.length,(pg+1)*PAGE)} ${state.lang==='sk'?'z':'of'} ${rows.length}</span>
    <button class="btn" ${pg===0?'disabled':''} onclick="pageBy('${id}',-1)">←</button>
    <button class="btn" ${(pg+1)*PAGE>=rows.length?'disabled':''} onclick="pageBy('${id}',1)">→</button></div>`:'';
  const body=view.length?view.map(r=>`<tr${r.go?` onclick="go('#${r.go}')" style="cursor:pointer"`:' style="cursor:default"'}>${r.c.map(cellHTML).join('')}</tr>`).join('')
    :`<tr><td colspan="${b.cols.length}" style="text-align:center;color:var(--ink-3);padding:26px">${state.lang==='sk'?'Žiadne riadky':'No rows'}</td></tr>`;
  const inner=`<div class="tbl-wrap"${b.title?' style="border:0;background:none"':''}><table class="t"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${pager}
    ${b.note?`<div class="hm-note">${esc(tr(b.note))}</div>`:''}`;
  return b.title?`<div class="card"><div class="ch"><h3>${esc(tr(b.title))}</h3><span class="sp">${rows.length} ${state.lang==='sk'?'riadkov':'rows'}</span></div>${inner}</div>`:inner;
}
function sortBy(id,i){const s=state.sort[id];state.sort[id]=(s&&s.i===i&&s.dir==='asc')?{i,dir:'desc'}:{i,dir:'asc'};route();}
function pageBy(id,d){state.page[id]=Math.max(0,(state.page[id]||0)+d);route();}

/* ── karty a bloky ─────────────────────────────────────────── */
function kpiCard(k){
  const v=(k.v&&k.v.t)?fmtCell(k.v):tr(k.v);
  const live=k.live&&APP.api?`<span class="cn-glyph">● live ${connTime()}</span>`:'';
  const tone=k.tone?`<div class="d ${k.tone==='ok'?'up':k.tone==='no'?'down':'flat'}">${k.tone==='ok'?'OK':k.tone==='no'?(state.lang==='sk'?'pozor':'alert'):(state.lang==='sk'?'sleduj':'watch')}</div>`:'';
  return `<div class="kpi"><div class="l">${esc(tr(k.l))}${live}</div><div class="v">${esc(v)}</div>
    ${k.sub?`<div class="d flat">${esc(val(k.sub))}</div>`:tone}</div>`;
}
function mdLite(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .split('\n\n').map(par=>{const ls=par.split('\n');
      if(ls.every(l=>/^[-•]\s/.test(l)))return '<ul>'+ls.map(l=>`<li>${l.replace(/^[-•]\s/,'')}</li>`).join('')+'</ul>';
      return `<p>${ls.join('<br>')}</p>`;}).join('');
}
let CURSCR=null;
function block(b,bi){
  const wrap=(t,inner,note)=>`<div class="card"><div class="ch"><h3>${esc(tr(t))}</h3></div>${inner}${note?`<div class="hm-note">${esc(tr(note))}</div>`:''}</div>`;
  switch(b.t){
    case 'kpis':return `<div class="kpis" style="margin-bottom:0">${b.items.map(kpiCard).join('')}</div>`;
    case 'bars':return wrap(b.title,bars(b.data),b.note);
    case 'lines':return wrap(b.title,lines(b),b.note);
    case 'stack':return wrap(b.title,stackChart(b),b.note);
    case 'donut':return wrap(b.title,donut(b.pct,b.label),b.note);
    case 'heat':return wrap(b.title,heat(b),b.note);
    case 'gantt':return wrap(b.title,gantt(b),b.note);
    case 'matrix':return wrap(b.title,matrix(b),b.note);
    case 'graph':return wrap(b.title,graphBlock(b),b.note);
    case 'table':return tableBlock(b,bi);
    case 'cards':return `<div class="b${b.n===2?'2':'3'}">${b.items.map(it=>`<div class="gcard">
      <div class="gh"><div class="gt"><b>${esc(val(it.title))}</b>${it.sub?`<small>${esc(val(it.sub))}</small>`:''}</div>
        ${it.badge?`<span class="badge ${esc(it.badge[0])}">${esc(tr(it.badge[1]))}</span>`:''}</div>
      ${it.lines&&it.lines.length?`<div class="gl">${it.lines.map(l=>`<div class="gr"><span>${esc(tr(l[0]))}</span><b>${esc(val(l[1]))}</b></div>`).join('')}</div>`:''}
      ${it.chips&&it.chips.length?`<div class="gc">${it.chips.map(c=>`<i>${esc(val(c))}</i>`).join('')}</div>`:''}</div>`).join('')}</div>`;
    case 'list':return wrap(b.title,`<div class="glist">${b.items.map(it=>`<div class="gi">
      <div class="gx"><b>${esc(val(it.title))}</b>${it.sub?`<small>${esc(val(it.sub))}</small>`:''}</div>
      ${it.badge?`<span class="badge ${esc(it.badge[0])}">${esc(tr(it.badge[1]))}</span>`:''}
      ${it.meta?`<span class="gm">${esc(val(it.meta))}</span>`:''}</div>`).join('')}</div>`,b.note);
    case 'kanban':return `<div class="kb">${b.columns.map(col=>`<div class="kbcol"><div class="kh">${esc(tr(col.l))}<i>${col.items.length}</i></div>
      ${col.items.map(it=>`<div class="kbi"><b>${esc(val(it.title))}</b>${it.sub?`<small>${esc(val(it.sub))}</small>`:''}
        ${it.badge?`<span class="badge ${esc(it.badge[0])}">${esc(tr(it.badge[1]))}</span>`:''}</div>`).join('')}</div>`).join('')}</div>`;
    case 'form':return wrap(b.title,`<div class="gform">${b.fields.map((f,fi)=>{
        const key=(CURSCR||'')+'.'+bi+'.'+fi;
        const on=state.toggles[key]!==undefined?state.toggles[key]:!!f.on;
        const ctl=f.type==='switch'?`<button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(tr(f.l))}" onclick="swTog(this,'${key}','${esc(tr(f.l)).replace(/'/g,'')}')"></button>`
          :f.type==='select'?`<button class="gsel" onclick="toast('${state.lang==='sk'?'Prepnuté (demo)':'Switched (demo)'}')">${esc(val(f.v))} ${svg('chev',13)}</button>`
          :f.type==='textarea'?`<div class="gin ta">${esc(val(f.v))}</div>`
          :`<div class="gin">${esc(val(f.v))}</div>`;
        return `<div class="grow"${f.type==='textarea'?' style="grid-template-columns:1fr"':''}><div class="gfl"><b>${esc(tr(f.l))}</b>${f.s?`<small>${esc(tr(f.s))}</small>`:''}</div>${ctl}</div>`;
      }).join('')}</div>`,b.note);
    case 'timeline':return wrap(b.title,`<div class="time">${b.items.map(t=>`<div class="ti"><div class="mk"></div><div class="tt">${esc(val(t[1]))}<small>${esc(val(t[0]))}</small></div></div>`).join('')}</div>`,b.note);
    case 'gallery':return wrap(b.title,`<div class="kpis" style="grid-template-columns:repeat(${Math.min(5,b.items.length)},1fr);margin-bottom:0">
      ${b.items.map(c=>`<div class="kpi"><div class="l">${esc(val(c.t))}</div><div class="v">${grp(c.n)}</div>
        ${c.qa!==undefined?`<div class="d ${c.qa>=90?'up':'down'}">QA ${decs(c.qa)}${NBSP}%</div>`:''}</div>`).join('')}</div>`,b.note);
    case 'banner':return `<div class="banner ${esc(b.tone)}">${svg(b.tone==='ok'?'check':'warn')}<span>${esc(tr(b.text))}</span></div>`;
    case 'note':return `<div class="hm-note" style="margin:0">${esc(tr(b.text))}</div>`;
    case 'code':return `<div class="codew"><div class="cbar"><b>${esc(tr(b.title))}</b><span class="lg">${esc(b.lang||'text')}</span>

    default:return '';

}

function renderScreen(s){

function toast(msg){
  const w=document.getElementById('toasts');const el=document.createElement('div');
  el.className='toast';el.setAttribute('role','status');el.innerHTML=`${svg('check',15)}<span>${esc(msg)}</span>`;
  w.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(6px)';setTimeout(()=>el.remove(),260);},2100);
}
function swTog(el,key,label){const on=el.getAttribute('aria-checked')==='true';
  el.setAttribute('aria-checked',String(!on));state.toggles[key]=!on;
  audit(L('Nastavenie prepnuté','Setting toggled'),label+' → '+(!on?(state.lang==='sk'?'zap':'on'):(state.lang==='sk'?'vyp':'off')));
  toast((state.lang==='sk'?'Uložené: ':'Saved: ')+label);}
function closeOverlay(){document.querySelectorAll('.scrim,.cmdk,.modal,.dropdown').forEach(e=>e.remove());state.overlay=null;}
function scrim(){const s=document.createElement('div');s.className='scrim';s.onclick=closeOverlay;document.body.appendChild(s);return s;}
function audit(what,detail){state.audit.unshift({t:connTime(),w:tr(what),d:detail});}
function openCmdk(){
  closeOverlay();scrim();state.overlay='cmdk';
  const idx=[];
  (APP.screens||[]).forEach(s=>idx.push({cc:APP.acc,ic:s.icon||'doc',t:tr(s.title),s:tr(s.sub||''),kind:L('Obrazovka','Screen'),go:'#'+s.key}));
  (typeof APPS_META!=='undefined'?APPS_META:[]).filter(a=>a.key!==APP.key).forEach(a=>idx.push({cc:a.acc,ic:a.icon,t:a.name,s:tr(a.tag),kind:L('Aplikácia','App'),href:`../${a.key}/index.html`}));
  const el=document.createElement('div');el.className='cmdk';
  el.innerHTML=`<div class="ci">${svg('search')}<input id="cmdkIn" placeholder="${state.lang==='sk'?'Hľadať obrazovky a aplikácie…':'Search screens and apps…'}" aria-label="search"></div><div class="cres" id="cmdkRes"></div>`;
  document.body.appendChild(el);
  const draw=q=>{q=(q||'').toLowerCase().trim();
    const res=idx.filter(x=>!q||(tr(x.t)+' '+tr(x.s)).toLowerCase().includes(q)).slice(0,8);
    document.getElementById('cmdkRes').innerHTML=res.length?res.map(x=>`<div class="cr" style="--cc:${x.cc}" onclick="${x.href?`location.href='${x.href}'`:`closeOverlay();go('${x.go}')`}">
      <span class="ic">${svg(x.ic,16)}</span><div class="ct"><b>${esc(tr(x.t))}</b><small>${esc(tr(x.s))}</small></div><span class="kind">${esc(tr(x.kind))}</span></div>`).join('')
      :`<div class="cempty">${state.lang==='sk'?'Nič sa nenašlo.':'Nothing found.'}</div>`;};
  draw('');const inp=document.getElementById('cmdkIn');inp.oninput=e=>draw(e.target.value);inp.focus();
}
function toggleDrawer(){document.body.classList.toggle('drawer');}
function closeDrawer(){document.body.classList.remove('drawer');}

document.getElementById('themebtn').addEventListener('click',function(){
  state.theme=state.theme==='dark'?'light':'dark';

  this.setAttribute('aria-pressed',String(state.theme==='light'));
});
document.getElementById('hambBtn').addEventListener('click',toggleDrawer);
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if((e.metaKey||e.ctrlKey)&&(e.key||'').toLowerCase()==='k'){e.preventDefault();openCmdk();return;}
  if((e.metaKey||e.ctrlKey)&&(e.key||'').toLowerCase()==='j'){e.preventDefault();aiToggle();return;}
  if(e.key==='Escape'){if(state.overlay){closeOverlay();return;}if(state.chat.open){aiToggle();return;}return;}
  if(tag==='input'||tag==='textarea'||e.metaKey||e.ctrlKey||e.altKey)return;

});

/* ── Shop API konektor ─────────────────────────────────────── */
const CT0=[9,41];
function connTime(){const m=(CT0[1]+state.conn.tick*3)%60,h=(CT0[0]+Math.floor((CT0[1]+state.conn.tick*3)/60))%24;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function connPill(){
  if(!APP.api)return '<div class="gspace"></div>';
  const out=state.conn.out;
  const tone=out?'no':(APP.api.tone||'ok');
  const txt=out?(state.lang==='sk'?'API nedostupné · z cache':'API down · from cache')
    :(state.lang==='sk'?'LIVE · sync '+connTime():'LIVE · sync '+connTime());
  return `<button class="cn-pill ${tone}" onclick="openConn()" title="${state.lang==='sk'?'Stav Shop API':'Shop API status'}">
    <span class="cn-dot"></span>${esc(txt)}</button>`;
}
function openConn(){
  closeOverlay();scrim();state.overlay='modal';
  const eps=(APP.api.endpoints||[]);
  const el=document.createElement('div');el.className='modal';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="mh"><h3>Shop API</h3><button class="x" onclick="closeOverlay()" aria-label="${state.lang==='sk'?'Zavrieť':'Close'}">${svg('x',16)}</button></div>
    <div class="mb">
      <div class="glist">${eps.map(e=>`<div class="gi"><div class="gx"><b>${esc(e.k)}</b><small>${esc(tr(e.l))}</small></div>
        <span class="badge ${state.conn.out?'no':'ok'}">${state.conn.out?(state.lang==='sk'?'nedostupné':'down'):(state.lang==='sk'?'live':'live')}</span>
        <span class="gm">${state.conn.out?'—':(e.ms||120)+' ms'}</span></div>`).join('')}</div>
      <div class="hm-note">${state.lang==='sk'?'Posledný sync':'Last sync'}: ${connTime()} · ${state.lang==='sk'?'keš 30 s · timeout 4 s':'30 s cache · 4 s timeout'}</div>
      <div class="grow" style="border:0;padding-top:6px"><div class="gfl"><b>${state.lang==='sk'?'Simulovať výpadok':'Simulate outage'}</b>
        <small>${state.lang==='sk'?'appka musí zobraziť dôvod, nie staré číslo':'the app must show the reason, never a stale number'}</small></div>
        <button class="sw" role="switch" aria-checked="${state.conn.out}" onclick="connOut()"></button></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeOverlay()">${state.lang==='sk'?'Zavrieť':'Close'}</button>
      <button class="btn pri" onclick="connSync()">${svg('refresh',14)} ${state.lang==='sk'?'Synchronizovať teraz':'Sync now'}</button></div>`;
  document.body.appendChild(el);
}
function connSync(){
  state.conn.tick++;
  const r=mulberry32(hashStr(APP.key+state.conn.tick))();
  const j=((r*4)-2).toFixed(1);
  audit(L('Sync Shop API','Shop API sync'),(state.lang==='sk'?'odchýlka ':'delta ')+j+' %');
  closeOverlay();route();
  toast((state.lang==='sk'?'Synchronizované · odchýlka ':'Synced · delta ')+j+' %');
}
function connOut(){state.conn.out=!state.conn.out;closeOverlay();route();
  toast(state.conn.out?(state.lang==='sk'?'Simulujem výpadok API':'Simulating API outage'):(state.lang==='sk'?'API opäť live':'API live again'));}

function iwSteps(){
  const S=[L('Súbor','File'),L('Mapovanie','Mapping'),L('Validácia','Validation'),L('Súhrn','Summary')];
  return `<div class="iw-steps">${S.map((s,i)=>`<div class="iw-step ${IW.step===i+1?'on':''} ${IW.step>i+1?'done':''}">
    <b>${i+1}</b><span>${esc(tr(s))}</span></div>`).join('')}</div>`;
}
function iwParse(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  const d=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
  const head=lines[0].split(d).map(h=>h.trim());
  const rows=lines.slice(1).map(l=>l.split(d).map(c=>c.trim()));
  return {head,rows,d};
}

      ${IW.errs.length?`<div class="tbl-wrap"><table class="t"><thead><tr>

        <tbody>${IW.errs.slice(0,8).map(e=>`<tr style="cursor:default"><td class="n">${e.r}</td><td>${esc(e.c)}</td><td>${esc(e.v)}</td>
          <td><span class="badge no">${esc(tr(e.m))}</span></td></tr>`).join('')}</tbody></table></div>`
        :`<div class="banner ok" style="margin:0">${svg('check')}<span>${state.lang==='sk'?'Všetky riadky prešli typovou kontrolou.':'All rows passed the type check.'}</span></div>`}

      <div class="glist">${(APP.imp.key||[]).map(k=>`<div class="gi"><div class="gx"><b>${esc(tr(k))}</b>

}
function iwSample(){const p=iwParse(APP.imp.csv||'');iwLoad(p,state.lang==='sk'?'vzor.csv':'sample.csv');}
function iwFile(inp){const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{iwLoad(iwParse(String(r.result)),f.name);};r.readAsText(f,'utf-8');}
function iwLoad(p,name){
  IW.head=p.head;IW.rows=p.rows;IW.file=name;
  const cols=APP.imp.cols||[];
  IW.map=cols.map(c=>{const i=p.head.findIndex(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'')===c.k.toLowerCase().replace(/[^a-z0-9]/g,''));return i<0?null:i;});
  IW.errs=[];
  IW.rows.forEach((row,ri)=>cols.forEach((c,ci)=>{const mi=IW.map[ci];if(mi==null)return;
    const v=row[mi]==null?'':row[mi];
    if(c.t==='num'&&v!==''&&isNaN(Number(v.replace(',','.'))))IW.errs.push({r:ri+2,c:c.k,v,m:L('nie je číslo','not a number')});
    if(v===''&&c.req)IW.errs.push({r:ri+2,c:c.k,v:'—',m:L('povinné pole','required')});}));
  IW.step=2;iwDraw();
}
function iwStep(d){IW.step=Math.max(1,Math.min(4,IW.step+d));iwDraw();}
function iwApply(){
  const cols=APP.imp.cols||[];
  const good=IW.rows.filter((_,ri)=>!IW.errs.some(e=>e.r===ri+2));
  const target=APP.imp.target||screensOf()[1]||screensOf()[0];
  const s=scr(target);const bi=(s.blocks||[]).findIndex(b=>b.t==='table');
  if(bi>=0){const id=target+'-'+bi;const b=s.blocks[bi];
    const rows=good.slice(0,8).map(r=>({c:b.cols.map((_,ci)=>{const mi=IW.map[ci];
      const v=mi!=null&&r[mi]!=null?r[mi]:'—';
      return ci===b.cols.length-1?['q',L('z importu','imported')]:v;})}));
    state.extra[id]=(state.extra[id]||[]).concat(rows);}
  state.imp.last={s:target,n:good.length,f:IW.file};
  state.imp.hist.unshift({f:IW.file,n:good.length,t:connTime(),e:IW.errs.length});
  audit(L('Import','Import'),IW.file+' · '+good.length+(state.lang==='sk'?' riadkov':' rows'));
  closeOverlay();go('#'+target);route();
  toast((state.lang==='sk'?'Zapísané: ':'Applied: ')+good.length+(state.lang==='sk'?' riadkov':' rows'));
}
function impUndo(){
  const l=state.imp.last;if(!l)return;
  const s=scr(l.s);const bi=(s.blocks||[]).findIndex(b=>b.t==='table');
  if(bi>=0)state.extra[l.s+'-'+bi]=[];
  state.imp.last=null;audit(L('Import vrátený','Import undone'),l.f);route();
  toast(state.lang==='sk'?'Import vrátený':'Import undone');
}

function aiAsk(i){
  const s=scr(location.hash.replace(/^#/,'')||screensOf()[0])||{ai:[]};
  const q=(s.ai||[])[i];if(!q)return;
  state.chat.msgs.push({r:'u',t:q.q},{r:'a',t:q.a,cite:q.cite||'ukážka',act:q.act||null});
  aiRender();
}
function aiFree(){
  const inp=document.getElementById('aiIn');const v=inp&&inp.value.trim();if(!v)return;
  const s=scr(location.hash.replace(/^#/,'')||screensOf()[0])||{ai:[]};
  const hit=(s.ai||[]).find(q=>tr(q.q).toLowerCase().split(/\s+/).some(w=>w.length>4&&v.toLowerCase().includes(w)));
  state.chat.msgs.push({r:'u',t:v});
  state.chat.msgs.push(hit?{r:'a',t:hit.a,cite:hit.cite||'ukážka',act:hit.act||null}
    :{r:'a',cite:'ukážka',t:L('Na túto otázku nemám podklad na tejto obrazovke. Skús navrhované otázky — tie sú opreté o čísla, ktoré tu naozaj sú.',
        'I have no basis for that on this screen. Try the suggested questions — those are backed by figures actually shown here.')});
  inp.value='';aiRender();
}
function aiDo(k,label){

  if(k==='create'){audit(L('Založené z chatu','Created from chat'),label);toast(state.lang==='sk'?'Záznam založený (demo)':'Record created (demo)');return;}

function threadOf(id){

function chatThreadView(c,k){
  const msgs=threadOf(k);
  const body=msgs.map((m,i)=>{
    const A=m.r==='a';
    const tool=A&&m.tool?`<div class="tool open"><div class="th">${svg('term',14)}<b>${esc(m.tool.name)}</b><span class="ms">${m.tool.ms||''} ms</span></div>
      <div class="tb"><div class="tr2"><span>${state.lang==='sk'?'vstup':'input'}</span>${esc(tr(m.tool.args))}</div>
      <div class="tr2"><span>${state.lang==='sk'?'výstup':'output'}</span>${esc(tr(m.tool.out))}</div></div></div>`:'';
    const cite=A&&m.cite?`<div class="cite"><span class="cl">${state.lang==='sk'?'zdroj':'source'}</span>
      ${m.cite.map(x=>`<span class="cv"><i></i>${esc(x.k)} · ${esc(tr(x.l))}</span>`).join('')}</div>`:'';
    const art=m.art?`<div class="acts"><button class="act" onclick="toast('${state.lang==='sk'?'Artefakt (demo)':'Artifact (demo)'}')">${svg('doc',12)} ${esc(tr(m.art.title))}</button></div>`:'';
    const acts=(m.acts||[]).length?`<div class="acts">${m.acts.map(a=>`<button class="act" onclick="toast('${esc(tr(a.l)).replace(/'/g,'')} — demo')">${svg('ext',12)} ${esc(tr(a.l))}</button>`).join('')}</div>`:'';
    return `<div class="msg ${A?'a':'u'}"><span class="av2">${A?'AI':'SP'}</span><div class="body">${tool}
      <div class="bub">${mdLite(tr(m.t))}</div>${cite}${art}${acts}</div></div>`;}).join('');
  return `<div class="cmain">${chatBarHTML(c.title,c.when)}
    <div class="cthread" id="cthread" aria-live="polite"><div class="cwrap">${body}</div></div>
    ${chatComposer()}</div>`;
}
function chatComposer(){
  return `<div class="comp"><div class="compw"><div class="cbox">
    <div class="cin" contenteditable="true" role="textbox" data-ph="${state.lang==='sk'?'Napíš otázku — AuraAI vidí pamäť firmy aj appky…':'Type a question…'}"></div>
    <div class="crow"><button class="cchip" onclick="toast('demo')">${svg('clip',13)} ${state.lang==='sk'?'Priložiť':'Attach'}</button>
      <button class="cchip" onclick="go('#sablony')">${svg('book',13)} ${state.lang==='sk'?'Šablóna':'Template'}</button>
      <button class="cchip" onclick="go('#nastroje')">${svg('term',13)} ${state.lang==='sk'?'Nástroje':'Tools'}</button>
      <div class="sp2"><button class="csend" onclick="toast('${state.lang==='sk'?'Náhľad — odpoveď sa negeneruje':'Preview — no reply is generated'}')">${svg('send',16)}</button></div></div></div>
    <div class="chint"><span>Enter ${state.lang==='sk'?'odoslať':'send'}</span><span>⌘J overlay</span><span>Esc ${state.lang==='sk'?'zastaviť':'stop'}</span></div></div></div>`;
}
function chatEmptyView(){
  const map=(CHATAPP.convos||[]).slice(0,6).map(c=>c.id);
  return `<div class="cmain">${chatBarHTML(L('Nová konverzácia','New conversation'),CHATAPP.meta&&CHATAPP.meta.tag)}
    <div class="cempty2"><div class="cein"><div class="cw">${svg('<path d="M3 8l4 4 5-7 5 7 4-4-2 12H5L3 8z"/>',24)}</div>
      <h1>${state.lang==='sk'?'Na čom pracujeme?':'What are we working on?'}</h1>
      <p>${state.lang==='sk'?'Model qwen3:4b beží lokálne. AuraAI vidí pamäť firmy aj dáta appiek — každé číslo nesie zdroj.'
        :'qwen3:4b runs locally. AuraAI sees the company mind and app data — every figure carries its source.'}</p>
      <div class="sugg">${(CHATAPP.sugg||[]).map((s,i)=>`<button class="sug" onclick="go('#${map[i]||map[0]}')"><b>${esc(tr(s.t))}</b><small>${esc(tr(s.s))}</small></button>`).join('')}</div>
    </div></div>${chatComposer()}</div>`;
}
function chatSimple(title,inner){
  return `<div class="cmain">${chatBarHTML(title,'')}
    <div class="cthread" style="padding:20px 18px"><div class="cwrap" style="max-width:900px;gap:16px">${inner}</div></div></div>`;
}
function chatProjectsHTML(){return `<div class="b2">${(CHATAPP.projects||[]).map(p=>`<div class="gcard">
  <div class="gh"><div class="gt"><b>${esc(tr(p.name))}</b><small>${esc(tr(p.sub))}</small></div>
    <span class="badge info">${p.convos||0} ${state.lang==='sk'?'konverzácií':'chats'}</span></div>
  <div class="gl"><div class="gr"><span>${state.lang==='sk'?'Instrukcia':'Instruction'}</span><b>${esc(tr(p.instr))}</b></div></div>
  <div class="gc">${(p.files||[]).map(f=>`<i>${esc(f.n)} · ${esc(f.size)}</i>`).join('')}</div></div>`).join('')}</div>`;}
function chatHistoryHTML(){return `<div class="card"><div class="ch"><h3>${state.lang==='sk'?'Konverzácie':'Conversations'}</h3><span class="sp">${(CHATAPP.convos||[]).length}</span></div>
  <div class="glist">${(CHATAPP.convos||[]).map(c=>`<div class="gi" onclick="go('#${c.id}')" style="cursor:pointer">
    <div class="gx"><b>${esc(tr(c.title))}</b><small>${esc(tr(c.snippet))}</small></div><span class="gm">${esc(tr(c.when))}</span></div>`).join('')}</div></div>`;}
function chatPromptsHTML(){return `<div class="b3">${(CHATAPP.prompts||[]).map(p=>`<div class="gcard">
  <div class="gh"><div class="gt"><b>${esc(tr(p.t))}</b><small>${esc(tr(p.s))}</small></div></div>
  <div class="gc"><i>${esc(tr(p.tag))}</i></div></div>`).join('')}</div>`;}
function chatFilesHTML(){return `<div class="card"><div class="ch"><h3>${state.lang==='sk'?'Prílohy':'Attachments'}</h3><span class="sp">${(CHATAPP.files||[]).length}</span></div>
  <div class="glist">${(CHATAPP.files||[]).map(f=>`<div class="gi"><div class="gx"><b>${esc(f.n)}</b><small>${esc(f.kind)} · ${esc(f.size)}</small></div>
    ${f.st?`<span class="badge ${esc(f.st[0])}">${esc(tr(f.st[1]))}</span>`:''}</div>`).join('')}</div></div>`;}
function chatUsageHTML(){const u=CHATAPP.usage||{today:{},rows:[]};
  return `<div class="kpis" style="margin-bottom:0">
    ${kpiCard({l:L('Tokeny dnes','Tokens today'),v:(u.today&&u.today.tokens)||'—'})}
    ${kpiCard({l:L('Cena dnes','Cost today'),v:(u.today&&u.today.cost)||'—'})}
    ${kpiCard({l:L('Dopytov','Requests'),v:String((u.today&&u.today.reqs)||'—')})}
    ${kpiCard({l:L('Strop','Cap'),v:u.cap||'—'})}</div>
  <div class="card"><div class="ch"><h3>${state.lang==='sk'?'Posledné dni':'Recent days'}</h3></div>
    <div class="tbl-wrap" style="border:0;background:none"><table class="t"><tbody>
      ${(u.rows||[]).map(r=>`<tr style="cursor:default">${r.c.map(cellHTML).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function chatStatesHTML(){return `<div class="b2">${(CHATAPP.states||[]).map(s=>`<div class="gcard">
  <div class="gh"><div class="gt"><b>${esc(tr(s.l))}</b><small style="font-family:var(--mono)">${esc(s.k)}</small></div></div>
  <div class="gl"><div class="gr" style="display:block"><b style="font-weight:500">${esc(tr(s.d))}</b></div></div></div>`).join('')}</div>`;}
function chatToolsHTML(){return `<div class="card"><div class="ch"><h3>${state.lang==='sk'?'Nástroje, ktoré model smie volať':'Tools the model may call'}</h3></div>
  <div class="tbl-wrap" style="border:0;background:none"><table class="t"><thead><tr>
    <th>${state.lang==='sk'?'Nástroj':'Tool'}</th><th>${state.lang==='sk'?'Čo robí':'What it does'}</th><th>${state.lang==='sk'?'Zdroj':'Source'}</th>
    <th class="n">${state.lang==='sk'?'Volaní':'Calls'}</th><th class="n">ms</th><th>${state.lang==='sk'?'Povolené':'Allowed'}</th></tr></thead>
    <tbody>${(CHATAPP.tools||[]).map(t=>`<tr style="cursor:default"><td><b>${esc(t.n)}</b></td><td>${esc(tr(t.s))}</td><td>${esc(t.src||'')}</td>
      <td class="n">${grp(t.calls||0)}</td><td class="n">${t.ms||''}</td>
      <td><span class="badge ${t.allow?'ok':'q'}">${t.allow?(state.lang==='sk'?'áno':'yes'):(state.lang==='sk'?'nie':'no')}</span></td></tr>`).join('')}</tbody></table></div></div>`;}
function chatSettingsHTML(){
  return (CHATAPP.settings||[]).map((g,gi)=>block({t:'form',title:g.g,fields:(g.rows||[]).map(r=>({l:r.l,s:r.s,type:r.type,v:r.v,on:r.on}))},100+gi)).join('')+
    `<div class="card"><div class="ch"><h3>${state.lang==='sk'?'Klávesové skratky':'Keyboard shortcuts'}</h3></div>
      <div class="glist">${((CHATAPP.meta&&CHATAPP.meta.shortcuts)||[]).map(([k,l])=>`<div class="gi"><div class="gx"><b>${esc(tr(l))}</b></div>
        <span class="gm" style="border:1px solid var(--line);border-radius:6px;padding:2px 7px">${esc(k)}</span></div>`).join('')}</div></div>`;
}

applyStatic();
route();
Object.assign(window,{APP,APPS_META,state,I,go,route,openCmdk,closeOverlay,toast,openImport,openReport,openConn,connSync,connOut,aiToggle,aiAsk,sortBy,pageBy,impUndo,iwSample,iwStep,iwApply,rbDraw,rbCsv});
</script>
</body>
